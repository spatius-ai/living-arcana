      const waitForPresentedFrame = video => new Promise(resolve => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(fallbackTimer);
          resolve();
        };
        const fallbackTimer = window.setTimeout(finish, 120);
        if (typeof video.requestVideoFrameCallback === "function") {
          video.requestVideoFrameCallback(finish);
        } else {
          window.requestAnimationFrame(finish);
        }
      });

      const armStandbyVideo = () => {
        const standby = videos[1];
        if (!standby || disposed || standby.getAttribute("src")) return;
        standby.src = source;
        standby.load();
      };

      const crossfade = async () => {
        if (crossfading || disposed || document.hidden) return;
        crossfading = true;
        armStandbyVideo();
        const outgoing = activeVideo;
        const incoming = videos.find(video => video !== outgoing);
        resetVideo(incoming);

        try {
          await incoming.play();
          await waitForPresentedFrame(incoming);
        } catch {
          crossfading = false;
          return;
        }

        if (disposed || document.hidden) {
          resetVideo(incoming);
          crossfading = false;
          return;
        }

        // The next loop is already playing and has presented a decoded frame
        // before it becomes visible. Only the outgoing final frames fade,
        // preventing both a frozen handoff and the dip of a two-way fade.
        incoming.setAttribute("data-visible", "");
        window.cancelAnimationFrame(fadeFrame);
        fadeFrame = window.requestAnimationFrame(() => {
          fadeFrame = window.requestAnimationFrame(() => {
            outgoing.setAttribute("data-fading", "");
            window.clearTimeout(fadeTimer);
            fadeTimer = window.setTimeout(() => {
              resetVideo(outgoing);
              incoming.setAttribute("data-front", "");
              activeVideo = incoming;
              crossfading = false;
            }, CROSSFADE_MS);
          });
        });
      };

      const handleTimeUpdate = event => {
        const video = event.currentTarget;
        if (video !== activeVideo || crossfading || !Number.isFinite(video.duration)) return;
        if (video.duration - video.currentTime <= CROSSFADE_LEAD_SECONDS) crossfade();
      };

      const handleEnded = event => {
        if (event.currentTarget === activeVideo && !crossfading) crossfade();
      };

      const handleError = event => {
        const video = event.currentTarget;
        video.removeAttribute("data-fading");
        if (video === activeVideo) {
          // A failed mobile decode still shows the authored poster instead of
          // dropping all the way back to the near-black ambient gradient.
          video.setAttribute("data-visible", "");
          video.setAttribute("data-front", "");
        } else {
          video.removeAttribute("data-visible");
          video.removeAttribute("data-front");
        }
        announceBackgroundReady();
      };

      // Surface real buffering progress for the boot veil's percent counter.
      const reportBufferProgress = () => {
        const video = videos[0];
        if (!Number.isFinite(video.duration) || video.duration <= 0) return;
        const ranges = video.buffered;
        if (!ranges.length) return;
        const fraction = Math.min(1, ranges.end(ranges.length - 1) / video.duration);
        window.dispatchEvent(new CustomEvent("arcana:background-progress", { detail: fraction }));
      };

      videos.forEach(video => {
        video.addEventListener("timeupdate", handleTimeUpdate);
        video.addEventListener("ended", handleEnded);
        video.addEventListener("error", handleError);
      });
      // The standby element only matters at the first crossfade. Loading it at
      // boot downloaded the same multi-MB file twice in parallel, so it waits
      // until the active one can play through (crossfade arms it as a fallback).
      videos[0].addEventListener("canplaythrough", armStandbyVideo, { once: true });
      videos[0].src = source;
      videos[0].load();
      videos[0].addEventListener("progress", reportBufferProgress);
      videos[0].addEventListener("loadedmetadata", reportBufferProgress);

      let startingInitialPlayback = false;
      let playbackBlocked = false;
      const startInitialPlayback = async () => {
        if (startingInitialPlayback) return;
        if (disposed || document.hidden) {
          announceBackgroundReady();
          return;
        }
        startingInitialPlayback = true;
        try {
          await activeVideo.play();
          await waitForPresentedFrame(activeVideo);
          activeVideo.setAttribute("data-visible", "");
          activeVideo.setAttribute("data-front", "");
          playbackBlocked = false;
        } catch {
          /* Low Power Mode and embedded iOS browsers can reject autoplay even
             for muted inline media. Keep the poster or decoded first frame
             visible and retry on the first real user gesture. */
          activeVideo.setAttribute("data-visible", "");
          activeVideo.setAttribute("data-front", "");
          playbackBlocked = true;
        }
        startingInitialPlayback = false;
        announceBackgroundReady();
      };

      if (activeVideo.readyState >= 2) startInitialPlayback();
      else activeVideo.addEventListener("loadeddata", startInitialPlayback, { once: true });

      const syncPlayback = () => {
        if (document.hidden) {
          videos.forEach(video => video.pause());
          return;
        }
        // If the page loaded while hidden, the initial reveal never ran —
        // without this, the video plays invisibly until the first crossfade.
        if (!activeVideo.hasAttribute("data-visible") && !crossfading) {
          if (activeVideo.readyState >= 2) startInitialPlayback();
          return;
        }
        activeVideo.play().catch(() => {});
      };
      const retryBlockedPlayback = () => {
        if (!playbackBlocked || disposed || document.hidden) return;
        startInitialPlayback();
      };
      document.addEventListener("visibilitychange", syncPlayback);
      document.addEventListener("pointerdown", retryBlockedPlayback, { passive: true });
      document.addEventListener("touchstart", retryBlockedPlayback, { passive: true });
      window.addEventListener("pageshow", syncPlayback);

      return () => {
        disposed = true;
        window.clearTimeout(fadeTimer);
        window.cancelAnimationFrame(fadeFrame);
        document.removeEventListener("visibilitychange", syncPlayback);
        document.removeEventListener("pointerdown", retryBlockedPlayback);
        document.removeEventListener("touchstart", retryBlockedPlayback);
        window.removeEventListener("pageshow", syncPlayback);
        videos[0].removeEventListener("progress", reportBufferProgress);
        videos[0].removeEventListener("loadedmetadata", reportBufferProgress);
        videos.forEach(video => {
          video.removeEventListener("timeupdate", handleTimeUpdate);
          video.removeEventListener("ended", handleEnded);
          video.removeEventListener("error", handleError);
          resetVideo(video);
        });
      };
    }

    function initApp(app, variant, {
      spatiusAdapter = window.SPATIUS_ADAPTER || {},
      getActiveCard = () => TAROT_CARDS[1],
      getCardAvatarId = card => card.avatarId,
      defaultAvatarId = ""
    } = {}) {
      let started = false;
      let completed = false;
      let cardState = "idle";
      let timers = [];
      let cleanupBackground = () => {};
      let archiveController = null;
      let archiveControllerPromise = null;
      let overlayReturnFocus = null;
      let readingSpeechRun = 0;
      let navigationTransitionRun = 0;
      let navigationAnimations = [];
      let lastTodayView = "today";
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const spatius = spatiusAdapter;
      const callSpatius = (method, payload) => Promise.resolve(spatius[method]?.(payload)).catch(() => {});
      const currentCard = () => getActiveCard?.() || TAROT_CARDS[1];
      // Debug overrides (?card=) opt out of the once-a-day rule so the full
      // draw flow stays replayable while tuning; they also never persist.
      const debugCardOverride = new URLSearchParams(window.location.search).has("card");
      const persistCompletedDraw = () => {
        if (!debugCardOverride) recordDailyDraw(currentCard().id);
      };
      const cardPayload = (extra = {}) => {
        const card = currentCard();
        return {
          cardId: card.id,
          avatarId: getCardAvatarId(card) || defaultAvatarId || undefined,
          transform: card.composition.avatar,
          voiceId: card.tts.voiceId || undefined,
          voiceSettings: {
            stability: card.tts.stability,
            similarityBoost: card.tts.similarityBoost,
            style: card.tts.style,
            speed: card.tts.speed
          },
          ...extra
        };
      };
      const delay = (fn, ms) => {
        const timer = window.setTimeout(fn, reduced ? 0 : ms);
        timers.push(timer);
        return timer;
      };
      const SHARED_CARD_DURATION = 620;
      const STATIC_CARD_DWELL = 1050;
      const LANDING_EXIT_DURATION = 300;
      const sharedCard = app.querySelector(".card-cluster");
      const drawButton = app.querySelector('[data-action="draw"]');
      const todayCard = app.querySelector(".today-card-button");
      const todayTilt = app.querySelector(".today-card-tilt");
      const todayShell = app.querySelector(".today-card-shell");
      const todayVideo = app.querySelector(".today-card-video");
      const returnVideo = app.querySelector(".return-card-video");
      const readingShader = app.querySelector(".shader-canvas");
      const homeHoverMaterial = createCardHoverMaterial({
        target: todayCard,
        tilt: todayTilt,
        canvas: app.querySelector(".today-hover-material"),
        reducedMotion: reduced,
        enabled: () => app.dataset.view === "today" && completed,
        getArtworkUrl: () => getActiveCard()?.composition?.staticArtworkUrl || "",
        getStrength: () => {
          const value = Number.parseFloat(getComputedStyle(app).getPropertyValue("--home-holographic-strength"));
          return Number.isFinite(value) ? value : 0.68;
        },
      });
      const materialStrength = () => {
        const value = Number.parseFloat(getComputedStyle(app).getPropertyValue("--home-holographic-strength"));
        return Number.isFinite(value) ? value : 0.68;
      };
      const readingCardButton = app.querySelector(".card-hitbox");
      const readingCardMaterial = createDualFaceCardMaterial({
        target: readingCardButton,
        tilt: app.querySelector(".card-object"),
        frontCanvas: app.querySelector(".card-front-diffraction-canvas"),
        backCanvas: app.querySelector(".card-back-metal-canvas"),
        reducedMotion: reduced,
        maxTilt: 1.5,
        getSide: () => ["summoning", "back"].includes(cardState) ? "back" : "front",
        enabled: () => app.dataset.view === "reading" && ["back", "static", "live"].includes(cardState),
        getFrontArtworkUrl: () => currentCard()?.composition?.staticArtworkUrl || "",
        getStrength: materialStrength,
      });
      const archiveFocusButton = app.querySelector(".focus-card-button");
      const archiveFocusFront = app.querySelector(".archive-focus-overlay .focus-front");
      const archiveFocusMaterial = createDualFaceCardMaterial({
        target: archiveFocusButton,
        tilt: app.querySelector(".focus-card-tilt"),
        frontCanvas: app.querySelector(".focus-front-diffraction-canvas"),
        backCanvas: app.querySelector(".focus-back-metal-canvas"),
        reducedMotion: reduced,
        maxTilt: 2.4,
        getSide: () => archiveFocusButton.hasAttribute("data-flipped") ? "front" : "back",
        enabled: () => app.querySelector(".archive-focus-overlay")?.hasAttribute("data-open"),
        getFrontArtworkUrl: () => TAROT_CARDS.find(card => card.id === archiveFocusButton.dataset.cardId)?.composition?.libraryArtworkUrl || "",
        getStrength: materialStrength,
      });
      const archiveFocusVideo = app.querySelector("[data-archive-focus-video]");
      let idleVideoPromise = null;
      let idleVideoSource = "";
      let archiveFocusVideoToken = 0;

      function setSharedCardGeometry(fromElement, toElement) {
        const from = fromElement.getBoundingClientRect();
        const to = toElement.getBoundingClientRect();
        if (!from.width || !from.height || !to.width || !to.height) return false;
        const fromCenterX = from.left + from.width / 2;
        const fromCenterY = from.top + from.height / 2;
        const toCenterX = to.left + to.width / 2;
        const toCenterY = to.top + to.height / 2;
        const scale = to.width / from.width;
        const sourceRadius = Number.parseFloat(getComputedStyle(app.querySelector(".card-front")).borderTopLeftRadius) || 48;
        sharedCard.style.setProperty("--shared-card-x", `${toCenterX - fromCenterX}px`);
        sharedCard.style.setProperty("--shared-card-y", `${toCenterY - fromCenterY}px`);
        sharedCard.style.setProperty("--shared-card-scale", String(scale));
        todayCard.style.setProperty("--home-card-radius", `${sourceRadius * scale}px`);
        todayCard.style.setProperty("--home-live-width", `${from.width}px`);
        todayCard.style.setProperty("--home-live-height", `${from.height}px`);
        todayCard.style.setProperty("--home-live-scale", String(scale));
        return true;
      }

      function clearSharedCardGeometry() {
        sharedCard.style.removeProperty("--shared-card-x");
        sharedCard.style.removeProperty("--shared-card-y");
        sharedCard.style.removeProperty("--shared-card-scale");
        todayCard.style.removeProperty("--home-card-radius");
      }

      function prepareIdleCardVideo() {
        const source = currentCard().composition.motionVideoUrl;
        if (!source || reduced) return Promise.resolve(false);
        if (idleVideoPromise && idleVideoSource === source) return idleVideoPromise;
        idleVideoSource = source;

        const prepareVideo = video => new Promise(resolve => {
          let settled = false;
          video.pause();
          video.removeAttribute("data-ready");
          const finish = ready => {
            if (settled) return;
            settled = true;
            if (ready) video.setAttribute("data-ready", "");
            resolve(ready);
          };
          const revealFirstFrame = () => {
            Promise.resolve(video.play()).then(() => {
              if (typeof video.requestVideoFrameCallback === "function") {
                video.requestVideoFrameCallback(() => finish(true));
              } else {
                finish(true);
              }
            }).catch(() => finish(video.readyState >= 2));
          };
          video.addEventListener("error", () => finish(false), { once: true });
          video.addEventListener("loadeddata", revealFirstFrame, { once: true });
          video.src = source;
          video.load();
        });

        idleVideoPromise = Promise.all([todayVideo, returnVideo].map(prepareVideo))
          .then(results => results.every(Boolean));
        return idleVideoPromise;
      }

      function stopArchiveFocusVideo({ clear = true } = {}) {
        archiveFocusVideoToken += 1;
        archiveFocusFront?.removeAttribute("data-video-ready");
        if (!archiveFocusVideo) return;
        archiveFocusVideo.pause();
        archiveFocusVideo.onloadeddata = null;
        archiveFocusVideo.onerror = null;
        if (clear) {
          archiveFocusVideo.removeAttribute("src");
          archiveFocusVideo.removeAttribute("poster");
          archiveFocusVideo.load();
        }
      }

      function prepareArchiveFocusVideo(card) {
        stopArchiveFocusVideo();
        const source = card?.composition.motionVideoUrl;
        if (!archiveFocusVideo || !archiveFocusFront || !source || reduced) return;

        const token = ++archiveFocusVideoToken;
        archiveFocusVideo.poster = card.composition.libraryArtworkUrl;
        const markReady = () => {
          if (token !== archiveFocusVideoToken) return;
          archiveFocusFront.setAttribute("data-video-ready", "");
          if (!archiveFocusButton.hasAttribute("data-flipped")) archiveFocusVideo.pause();
        };
        const revealFirstFrame = () => {
          if (token !== archiveFocusVideoToken) return;
          Promise.resolve(archiveFocusVideo.play()).then(() => {
            if (typeof archiveFocusVideo.requestVideoFrameCallback === "function") {
              archiveFocusVideo.requestVideoFrameCallback(markReady);
            } else {
              markReady();
            }
          }).catch(() => {
            if (archiveFocusVideo.readyState >= 2) markReady();
          });
        };

        archiveFocusVideo.onloadeddata = revealFirstFrame;
        archiveFocusVideo.onerror = () => {
          if (token === archiveFocusVideoToken) stopArchiveFocusVideo();
        };
        archiveFocusVideo.src = source;
        archiveFocusVideo.load();
      }

      function freezeHomeCardShell() {
        const transform = getComputedStyle(todayShell).transform;
        todayShell.style.animation = "none";
        todayShell.style.transition = "none";
        todayShell.style.transform = transform === "none" ? "none" : transform;
        todayShell.getBoundingClientRect();
      }

      function clearHomeCardShellOverride() {
        todayShell.style.removeProperty("animation");
        todayShell.style.removeProperty("transition");
        todayShell.style.removeProperty("transform");
      }

      function syncIdleVideos(sourceVideo, targetVideo) {
        if (sourceVideo.readyState >= 2 && targetVideo.readyState >= 2) {
          const time = sourceVideo.currentTime;
          if (Number.isFinite(time) && Math.abs(targetVideo.currentTime - time) > 0.04) {
            try { targetVideo.currentTime = time; } catch {}
          }
        }
        targetVideo.play().catch(() => {});
      }

      function ensureArchiveScene() {
        if (reduced) return Promise.resolve(null);
        if (!archiveControllerPromise) {
          const archiveStage = app.querySelector(".archive-webgl-stage");
          const archiveStatus = app.querySelector(".archive-webgl-status");
          const archiveFallback = app.querySelector(".archive-arc");
          app.dataset.archiveWebgl = "loading";
          archiveStage.setAttribute("aria-busy", "true");
          archiveStatus.textContent = "Preparing the Major Arcana library.";
          archiveFallback.setAttribute("aria-hidden", "true");
          archiveFallback.querySelectorAll("button").forEach(button => { button.tabIndex = -1; });
          archiveControllerPromise = setupArchiveScene(app).then(controller => {
            archiveController = controller;
            controller.setActive(app.dataset.view === "archive");
            archiveStage.removeAttribute("aria-busy");
            return controller;
          }).catch(error => {
            console.warn("Archive WebGL scene unavailable; using the accessible card layout instead.", error);
            app.dataset.archiveWebgl = "fallback";
            archiveStage.removeAttribute("aria-busy");
            archiveStatus.textContent = "The accessible Major Arcana library is ready.";
            archiveFallback.removeAttribute("aria-hidden");
            archiveFallback.querySelectorAll("button").forEach(button => { button.tabIndex = 0; });
            return null;
          });
        }
        return archiveControllerPromise;
      }

      function setView(view) {
        if (view !== "today") homeHoverMaterial.reset({ immediate: true });
        app.dataset.view = view;
        try { window.sessionStorage.setItem("living-arcana.last-view.v1", view); } catch {}
        if (view === "today" || view === "reading") lastTodayView = view;
        app.querySelectorAll(".scene").forEach(scene => {
          const active = scene.classList.contains(`${view}-view`);
          scene.setAttribute("aria-hidden", active ? "false" : "true");
          scene.inert = !active;
        });
        const todayNav = app.querySelector('[data-action="today"]');
        const consultationNav = app.querySelector('[data-action="consultation"]');
        const archiveNav = app.querySelector('[data-action="archive"]');
        const todayCurrent = view === "today" || view === "reading";
        const consultationCurrent = view === "consultation";
        const archiveCurrent = view === "archive";
        todayNav.toggleAttribute("data-current", todayCurrent);
        consultationNav.toggleAttribute("data-current", consultationCurrent);
        archiveNav.toggleAttribute("data-current", archiveCurrent);
        [todayNav, consultationNav, archiveNav].forEach(nav => nav.removeAttribute("aria-current"));
        if (todayCurrent) todayNav.setAttribute("aria-current", "page");
        if (consultationCurrent) consultationNav.setAttribute("aria-current", "page");
        if (archiveCurrent) archiveNav.setAttribute("aria-current", "page");
        if (view === "archive") {
          requestAnimationFrame(() => layoutArchive(app));
          ensureArchiveScene().then(controller => controller?.setActive(app.dataset.view === "archive"));
        } else {
          archiveController?.setActive(false);
        }
      }

      function clearNavigationTransition() {
        navigationTransitionRun += 1;
        navigationAnimations.forEach(animation => animation.cancel());
        navigationAnimations = [];
        app.querySelectorAll(".scene").forEach(scene => {
          scene.style.removeProperty("visibility");
          scene.style.removeProperty("z-index");
          scene.style.removeProperty("will-change");
          scene.style.removeProperty("pointer-events");
        });
      }

      function transitionView(view, { animate = true } = {}) {
        const previousView = app.dataset.view;
        const navigationIndex = { today: 0, reading: 0, consultation: 1, archive: 2 };
        const isPrimaryNavigation = previousView !== view
          && navigationIndex[previousView] !== navigationIndex[view];
        if (!animate || reduced || !isPrimaryNavigation) {
          clearNavigationTransition();
          setView(view);
          return Promise.resolve();
        }

        const outgoing = app.querySelector(`.${previousView}-view`);
        const incoming = app.querySelector(`.${view}-view`);
        if (!outgoing || !incoming) {
          clearNavigationTransition();
          setView(view);
          return Promise.resolve();
        }

        const interrupted = navigationAnimations.length > 0;
        const captured = interrupted ? new Map([outgoing, incoming].map(scene => {
          const style = getComputedStyle(scene);
          return [scene, { opacity: style.opacity, transform: style.transform }];
        })) : null;
        clearNavigationTransition();
        const run = navigationTransitionRun;
        const direction = navigationIndex[view] > navigationIndex[previousView] ? 1 : -1;

        outgoing.style.visibility = "visible";
        outgoing.style.zIndex = "1";
        outgoing.style.willChange = "transform, opacity";
        outgoing.style.pointerEvents = "none";
        incoming.style.visibility = "visible";
        incoming.style.zIndex = "2";
        incoming.style.willChange = "transform, opacity";
        incoming.style.pointerEvents = "none";
        setView(view);

        const outgoingStart = captured?.get(outgoing) || { opacity: 1, transform: "translate3d(0, 0, 0)" };
        const incomingStart = captured?.get(incoming) || { opacity: 0, transform: `translate3d(${direction * 14}px, 0, 0)` };
        const easing = "cubic-bezier(0.23, 1, 0.32, 1)";
        const outgoingAnimation = outgoing.animate([
          outgoingStart,
          { opacity: 0, transform: `translate3d(${-direction * 10}px, 0, 0)` },
        ], { duration: interrupted ? 160 : 180, easing, fill: "both" });
        const incomingAnimation = incoming.animate([
          incomingStart,
          { opacity: 1, transform: "translate3d(0, 0, 0)" },
        ], { duration: interrupted ? 200 : 240, easing, fill: "both" });
        navigationAnimations = [outgoingAnimation, incomingAnimation];

        return Promise.allSettled(navigationAnimations.map(animation => animation.finished)).then(() => {
          if (run !== navigationTransitionRun) return;
          clearNavigationTransition();
        });
      }

      function runNavigationChange(change, pointerInitiated) {
        const navigation = app.querySelector(".icon-nav");
        if (!pointerInitiated) navigation.setAttribute("data-instant", "");
        change(pointerInitiated);
        if (!pointerInitiated) {
          requestAnimationFrame(() => {
            navigation.getBoundingClientRect();
            navigation.removeAttribute("data-instant");
          });
        }
      }

      function setCardState(next) {
        cardState = next;
        app.dataset.cardState = next;
        readingCardMaterial.sync();
        const cardButton = app.querySelector('[data-action="flip"]');
        cardButton.disabled = !["back"].includes(next);
        cardButton.setAttribute("aria-label", next === "back" ? "Reveal today's card" : "Today's card");
        const fullCardButton = app.querySelector('.source-card');
        const fullCardAvailable = next === "live";
        fullCardButton.disabled = !fullCardAvailable;
        fullCardButton.tabIndex = fullCardAvailable ? 0 : -1;
      }

      function clearDelays() {
        timers.forEach(clearTimeout);
        timers = [];
      }

      function interruptReadingSpeech({ readyForQuestions = false } = {}) {
        readingSpeechRun += 1;
        callSpatius("stop");
        app.dataset.speaking = "false";
        if (readyForQuestions && completed && app.dataset.qa === "waiting") {
          app.dataset.qa = "ready";
          const speechLabel = app.querySelector("[data-speech-label]");
          if (speechLabel) speechLabel.textContent = "Reading paused · Ask one question";
        }
      }

      function resetIncompleteReadingState({ showToday = true } = {}) {
        started = false;
        delete app.dataset.landingExit;
        drawButton.disabled = false;
        app.dataset.underCard = "concealed";
        app.dataset.underCardRendered = "false";
        app.dataset.homeMedia = "live";
        app.dataset.readingMedia = "live";
        readingCardMaterial.reset({ immediate: true });
        if (showToday) setView("today");
        setCardState("idle");
      }

      function pauseIncompleteReadingAtStableState(checkpoint) {
        delete app.dataset.landingExit;
        drawButton.disabled = false;
        app.dataset.speaking = "false";

        if (["flipping", "static"].includes(checkpoint)) {
          completed = true;
          app.dataset.drawn = "true";
          persistCompletedDraw();
          app.dataset.underCard = "visible";
          app.dataset.underCardRendered = "true";
          app.dataset.qa = "ready";
          setCardState("live");
          const speechLabel = app.querySelector("[data-speech-label]");
          if (speechLabel) speechLabel.textContent = "Reading paused · Ask one question";
          void prepareIdleCardVideo();
          return;
        }

        app.dataset.underCard = "concealed";
        app.dataset.underCardRendered = "false";
        app.dataset.qa = "waiting";
        setCardState("back");
      }

      function cancelIncompleteReading({ animate = true } = {}) {
        if (completed) return false;

        clearDelays();
        interruptReadingSpeech();
        app.dataset.qa = "waiting";

        const finish = () => resetIncompleteReadingState();

        const canAnimate = animate
          && app.dataset.view === "reading"
          && ["summoning", "back", "flipping", "static"].includes(cardState);

        if (!canAnimate) {
          finish();
          return true;
        }

        setCardState("dismissing");
        delay(finish, 220);
        return true;
      }

      function summon() {
        if (cardState !== "idle" || app.dataset.landingExit === "true") return;
        started = true;
        app.dataset.landingExit = "true";
        drawButton.disabled = true;
        app.dataset.underCard = "concealed";
        app.dataset.underCardRendered = "false";
        const avatarPreparation = callSpatius("prepare", cardPayload({ scriptId: "daily-note-01" }));
        setView("reading");
        setCardState("summoning");
        app.dataset.qa = "waiting";
        delay(() => {
          delete app.dataset.landingExit;
          drawButton.disabled = false;
        }, LANDING_EXIT_DURATION);
        delay(() => {
          Promise.resolve(avatarPreparation).finally(() => {
            if (cardState === "summoning") setCardState("back");
          });
        }, 1210);
      }

      function flip() {
        if (cardState !== "back") return;
        // Use the revealing gesture to unlock the avatar's audio channel. The
        // visual reading starts later, after the artwork has had time to land.
        callSpatius("unlock", cardPayload());
        setCardState("flipping");
        delay(() => {
          if (cardState !== "flipping") return;
          app.dataset.underCardRendered = "true";
          setCardState("static");
          delay(activate, STATIC_CARD_DWELL);
        }, 640);
      }

      function activate() {
        if (cardState !== "static") return;
        completed = true;
        app.dataset.drawn = "true";
        persistCompletedDraw();
        app.dataset.underCard = "visible";
        prepareIdleCardVideo();
        const readingView = app.querySelector(".reading-view");
        readingView.scrollTop = 0;
        requestAnimationFrame(() => { readingView.scrollTop = 0; });
        setCardState("activating");
        runActivationShader(app.querySelector(".shader-canvas"), variant.shader);
        delay(() => {
          if (cardState !== "activating") return;
          setCardState("live");
          const speechRun = ++readingSpeechRun;
          app.dataset.speaking = "true";
          app.querySelector("[data-speech-label]").textContent = `${currentCard().name} is speaking`;
          let readingSettled = false;
          const settleReading = () => {
            if (readingSettled || speechRun !== readingSpeechRun) return;
            readingSettled = true;
            app.dataset.speaking = "false";
            app.dataset.qa = "ready";
            app.querySelector("[data-speech-label]").textContent = "Reading complete · Ask one question";
          };
          const card = currentCard();
          callSpatius("speak", cardPayload({ text: card.lead })).then(result => {
            if (speechRun !== readingSpeechRun || app.dataset.view !== "reading" || cardState !== "live") return;
            if (result?.completed) {
              settleReading();
              return;
            }
            if (result === undefined && cardState === "live") {
              callSpatius("play", cardPayload({ scriptId: "daily-note-01" })).then(fallbackResult => {
                if (speechRun !== readingSpeechRun || app.dataset.view !== "reading" || cardState !== "live") return;
                if (fallbackResult?.completed) settleReading();
                else delay(settleReading, 4200);
              });
              return;
            }
            settleReading();
          });
          delay(settleReading, 15000);
        }, 900);
      }

      function returnHome({ animate = false } = {}) {
        clearDelays();
        cancelPendingReadingReveal();
        delete app.dataset.readingCopyPrepared;
        app.dataset.underCard = "concealed";
        interruptReadingSpeech({ readyForQuestions: completed });
        if (!completed) {
          if (["archive", "consultation"].includes(app.dataset.view)) {
            app.dataset.qa = "waiting";
            const transition = transitionView("today", { animate });
            Promise.resolve(transition).finally(() => resetIncompleteReadingState({ showToday: false }));
            return;
          }
          cancelIncompleteReading();
          return;
        }
        if (app.dataset.view === "reading" && ["activating", "live"].includes(cardState)) {
          app.dataset.homeMedia = "video";
          setSharedCardGeometry(sharedCard, todayCard);
          setCardState("returning");
          prepareIdleCardVideo().then(() => {
            if (app.dataset.view !== "reading" || cardState !== "returning") return;
            syncIdleVideos(todayVideo, returnVideo);
            app.dataset.readingMedia = "transition";
            runActivationShader(readingShader, variant.shader, SHARED_CARD_DURATION);
          });
          delay(() => {
            app.dataset.readingMedia = "video";
            syncIdleVideos(returnVideo, todayVideo);
            returnVideo.pause();
            app.dataset.sharedCardSetup = "true";
            setView("today");
            setCardState("live");
            clearSharedCardGeometry();
            sharedCard.getBoundingClientRect();
            delete app.dataset.sharedCardSetup;
          }, SHARED_CARD_DURATION);
          return;
        }
        app.dataset.homeMedia = "video";
        // Rest on "video" (like the animated return path): the reading card
        // keeps the card motion up, so the next reopen never has to fade the
        // live avatar layer out across the view switch.
        app.dataset.readingMedia = "video";
        void prepareIdleCardVideo();
        transitionView("today", { animate });
        setCardState("live");
      }

      function openStandaloneView(view, { animate = false } = {}) {
        clearDelays();
        cancelPendingReadingReveal();
        const pauseIncompleteAfterExit = !completed && started;
        const incompleteCheckpoint = pauseIncompleteAfterExit ? cardState : null;
        const normalizeCompletedAfterExit = completed;
        if (pauseIncompleteAfterExit) {
          interruptReadingSpeech();
          app.dataset.qa = "waiting";
        } else if (normalizeCompletedAfterExit) {
          interruptReadingSpeech({ readyForQuestions: true });
        }
        const transition = transitionView(view, { animate });
        Promise.resolve(transition).finally(() => {
          delete app.dataset.readingCopyPrepared;
          if (pauseIncompleteAfterExit) {
            pauseIncompleteReadingAtStableState(incompleteCheckpoint);
            return;
          }
          if (!normalizeCompletedAfterExit) return;
          app.dataset.homeMedia = "video";
          app.dataset.readingMedia = "video";
          clearSharedCardGeometry();
          clearHomeCardShellOverride();
          delete app.dataset.sharedCardSetup;
          setCardState("live");
          void prepareIdleCardVideo();
        });
      }

      function openArchive(options) {
        openStandaloneView("archive", options);
      }

      function openConsultation(options) {
        openStandaloneView("consultation", options);
      }

      function openTodayTab({ animate = false } = {}) {
        if (!["archive", "consultation"].includes(app.dataset.view)) return;
        const targetView = lastTodayView === "reading" ? "reading" : "today";
        app.dataset.speaking = "false";
        if (targetView === "reading") {
          const host = app.querySelector('[data-spatius-host="reading"]');
          if (!host || host.hasAttribute("data-spatius-rendered")) {
            app.dataset.readingMedia = "live";
          } else {
            app.dataset.readingMedia = "video";
            prepareIdleCardVideo().then(() => {
              if (app.dataset.view === "reading" && app.dataset.readingMedia === "video") {
                syncIdleVideos(todayVideo, returnVideo);
              }
            });
            revealReadingMedia({ crossfade: false });
          }
        }
        transitionView(targetView, { animate });
      }

      let cancelPendingReadingReveal = () => {};

      // The reading card must not cross-fade to the live avatar before the
      // avatar has painted its first frame, or the card briefly turns empty.
      // While waiting, the idle card video stays on screen; the
      // reveal runs once data-spatius-rendered appears on the reading host.
      function revealReadingMedia({ crossfade = true } = {}) {
        cancelPendingReadingReveal();
        const goLive = () => {
          if (crossfade) {
            app.dataset.readingMedia = "reversing";
            runActivationShader(readingShader, variant.shader, SHARED_CARD_DURATION);
            delay(() => {
              app.dataset.readingMedia = "live";
              todayVideo.pause();
              returnVideo.pause();
            }, SHARED_CARD_DURATION);
            return;
          }
          app.dataset.readingMedia = "live";
          todayVideo.pause();
          returnVideo.pause();
        };
        const host = app.querySelector('[data-spatius-host="reading"]');
        if (!host || host.hasAttribute("data-spatius-rendered")) {
          goLive();
          return;
        }
        const observer = new MutationObserver(() => {
          if (!host.hasAttribute("data-spatius-rendered")) return;
          observer.disconnect();
          cancelPendingReadingReveal = () => {};
          if (app.dataset.view !== "reading" || cardState !== "live") return;
          if (app.dataset.view === "reading" && cardState === "live") goLive();
        });
        observer.observe(host, { attributes: true, attributeFilter: ["data-spatius-rendered"] });
        cancelPendingReadingReveal = () => {
          observer.disconnect();
          cancelPendingReadingReveal = () => {};
        };
      }

      function beginReopenMotion() {
        app.dataset.readingMedia = "video";
        app.dataset.readingCopyPrepared = "true";
        app.dataset.underCard = "concealed";
        app.dataset.underCardRendered = "true";
        syncIdleVideos(todayVideo, returnVideo);
        app.dataset.sharedCardSetup = "true";
        setSharedCardGeometry(sharedCard, todayShell);
        setCardState("returning");
        setView("reading");
        app.querySelector(".reading-copy").getBoundingClientRect();
        sharedCard.getBoundingClientRect();
        requestAnimationFrame(() => {
          delete app.dataset.sharedCardSetup;
          sharedCard.getBoundingClientRect();
          requestAnimationFrame(() => {
            setCardState("live");
            app.dataset.underCard = "visible";
            clearHomeCardShellOverride();
            revealReadingMedia();
            delay(() => {
              delete app.dataset.readingCopyPrepared;
              clearSharedCardGeometry();
            }, SHARED_CARD_DURATION);
          });
        });
      }

      function reopenReading() {
        if (!completed || app.dataset.view !== "today") return;
        // The reopen click is a user gesture: use it to (re)awaken the avatar
        // so a restored session receives a rendered first frame and speech
        // works without a prior draw in this page load.
        callSpatius("unlock", cardPayload());
        homeHoverMaterial.reset({ immediate: true });
        freezeHomeCardShell();
        prepareIdleCardVideo().then(beginReopenMotion);
      }

      function openOverlay(overlay) {
        overlayReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
        [app.querySelector(".site-header"), app.querySelector("main"), app.querySelector(".site-footer")]
          .filter(Boolean)
          .forEach(element => { element.inert = true; });
        overlay.inert = false;
        overlay.setAttribute("data-open", "");
        overlay.setAttribute("aria-hidden", "false");
        if (overlay.classList.contains("archive-focus-overlay")) {
          archiveFocusMaterial.sync();
        }
        overlay.querySelector("button")?.focus();
      }

      function closeOverlays() {
        let closed = false;
        app.querySelectorAll(".overlay[data-open]").forEach(overlay => {
          closed = true;
          if (overlay.classList.contains("archive-focus-overlay")) {
            archiveFocusMaterial.reset({ immediate: true });
            stopArchiveFocusVideo();
          }
          overlay.removeAttribute("data-open");
          overlay.setAttribute("aria-hidden", "true");
          overlay.inert = true;
          if (overlay.classList.contains("archive-focus-overlay")) archiveFocusMaterial.sync();
        });
        if (!closed) return;
        [app.querySelector(".site-header"), app.querySelector("main"), app.querySelector(".site-footer")]
          .filter(Boolean)
          .forEach(element => { element.inert = false; });
        const focusTarget = overlayReturnFocus;
        overlayReturnFocus = null;
        requestAnimationFrame(() => focusTarget?.isConnected && focusTarget.focus({ preventScroll: true }));
      }

      app.addEventListener("click", event => {
        // A React-controlled reading log may unmount during its close click.
        // `event.target.closest()` then loses the original ancestors before
        // this native listener runs, so preserve the dispatch-time boundary
        // through the immutable composed path.
        const fromReadingLog = event.composedPath().some(node =>
          node instanceof Element && node.classList.contains("reading-log-dialog")
        );
        if (fromReadingLog) return;

        const action = event.target.closest("[data-action]")?.dataset.action;
        if (!action) {
          const onReadingSurface = event.target.closest(".reading-view");
          const insideReadingContent = event.target.closest(".card-cluster, .card-reveal-prompt, .reading-copy");
          if (onReadingSurface && !insideReadingContent && app.dataset.view === "reading") {
            const readingCanDismiss = completed
              && cardState === "live"
              && app.dataset.speaking !== "true"
              && app.dataset.qa === "ready";
            if (readingCanDismiss) returnHome();
          }
          if (event.target.classList.contains("overlay")) closeOverlays();
          return;
        }

        if (action === "draw") summon();
        if (action === "flip") flip();
        if (action === "archive") runNavigationChange(animate => openArchive({ animate }), event.detail > 0);
        if (action === "consultation") runNavigationChange(animate => openConsultation({ animate }), event.detail > 0);
        if (action === "today") runNavigationChange(animate => openTodayTab({ animate }), event.detail > 0);
        if (action === "home") runNavigationChange(animate => returnHome({ animate }), event.detail > 0);
        if (action === "reopen") {
          if (event.detail > 0) event.target.closest(".today-card-button")?.blur();
          reopenReading();
        }
        if (action === "legal") openOverlay(app.querySelector(".legal-overlay"));
        if (action === "changelog") openOverlay(app.querySelector(".changelog-overlay"));
        if (action === "close-overlay") closeOverlays();
        if (action === "focus-flip") {
          const showingFront = event.target.closest(".focus-card-button").toggleAttribute("data-flipped");
          archiveFocusMaterial.sync();
          if (showingFront) archiveFocusVideo?.play().catch(() => {});
          else archiveFocusVideo?.pause();
        }
      });

      app.querySelectorAll(".archive-card").forEach(card => card.addEventListener("click", () => {
        const index = Number(card.dataset.cardIndex);
        const [roman, name] = CARD_NAMES[index];
        const selectedCard = TAROT_CARDS[index];
        const collected = card.hasAttribute("data-collected");
        const overlay = app.querySelector(".archive-focus-overlay");
        const focus = overlay.querySelector(".focus-card-button");
        const front = overlay.querySelector(".focus-front");
        focus.removeAttribute("data-flipped");
        focus.dataset.cardId = selectedCard.id;
        front.toggleAttribute("data-locked", !collected);
        front.querySelector("[data-archive-focus-artwork]").src = selectedCard.composition.libraryArtworkUrl;
        front.querySelector("[data-archive-focus-index]").textContent = `${roman} · Major Arcana`;
        front.querySelector("[data-archive-focus-name]").textContent = collected ? name : "Not yet awakened";
        overlay.querySelector(".focus-caption").textContent = collected ? `${roman} · ${name} · Click the card to flip` : `${roman} · Not yet encountered · Click the card to flip`;
        prepareArchiveFocusVideo(selectedCard);
        openOverlay(overlay);
      }));

      const archiveWarmTrigger = app.querySelector('[data-action="archive"]');
      const warmArchiveScene = () => {
        if (!reduced) void ensureArchiveScene();
      };
      archiveWarmTrigger.addEventListener("pointerenter", warmArchiveScene, { passive: true });
      archiveWarmTrigger.addEventListener("pointerdown", warmArchiveScene, { passive: true });
      archiveWarmTrigger.addEventListener("focus", warmArchiveScene);

      const escapeHandler = event => {
        if (event.key !== "Escape") return;
        if (app.querySelector(".reading-log-dialog")) return;
        if (app.querySelector(".overlay[data-open]")) closeOverlays();
        else if (["reading", "consultation"].includes(app.dataset.view)) returnHome();
      };
      document.addEventListener("keydown", escapeHandler);
      const cleanup = () => {
        clearDelays();
        clearNavigationTransition();
        delete app.dataset.readingCopyPrepared;
        cancelPendingReadingReveal();
        cleanupBackground();
        [todayVideo, returnVideo].forEach(video => {
          video.pause();
          video.removeAttribute("src");
          video.load();
        });
        callSpatius("stop");
        archiveController?.destroy();
        homeHoverMaterial.destroy();
        readingCardMaterial.destroy();
        archiveFocusMaterial.destroy();
        archiveWarmTrigger.removeEventListener("pointerenter", warmArchiveScene);
        archiveWarmTrigger.removeEventListener("pointerdown", warmArchiveScene);
        archiveWarmTrigger.removeEventListener("focus", warmArchiveScene);
        document.removeEventListener("keydown", escapeHandler);
      };
      app._cleanup = cleanup;

      // Enforce "One card · once a day": when today's draw already completed
      // (and no ?card= debug override is active), restore the drawn state so a
      // refresh lands on the drawn Today card instead of a fresh draw.
      if (!debugCardOverride && hasCompletedDailyDraw(currentCard().id)) {
        completed = true;
        app.dataset.restoreBoot = "true";
        app.dataset.drawn = "true";
        app.dataset.underCard = "visible";
        app.dataset.underCardRendered = "true";
        app.dataset.qa = "ready";
        // Match the resting drawn-Today media state (see returnHome): the
        // home card shows its card motion; the avatar only awakens after a
        // user gesture reopens the reading. Leaving either on "live" would
        // reveal an empty live-avatar surface before its first rendered frame.
        app.dataset.homeMedia = "video";
        app.dataset.readingMedia = "video";
        setCardState("live");
        const speechLabel = app.querySelector("[data-speech-label]");
        if (speechLabel) speechLabel.textContent = "Reading restored · Ask one question";
        // Re-enable transitions once the restored state has painted.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          delete app.dataset.restoreBoot;
        }));
      }

      // Normalize aria-hidden/inert for the initial view as well as later
      // navigation. A recoverable Three Cards session can boot directly into
      // consultation instead of flashing Today first.
      setView(app.dataset.view || "today");
      cleanupBackground = setupBackgroundVideo(app);
      // Only a restored draw shows the card motion at boot. Before the draw the
      // two card videos are invisible, and decoding them would compete with
      // the background video and the digital human preload behind the veil.
      if (completed) prepareIdleCardVideo();
      requestAnimationFrame(() => layoutArchive(app));
      return cleanup;
    }

    window.LIVING_ARCANA_ENGINE = Object.freeze({ initApp, layoutArchive });
    await import("/src/main.jsx");
  </script>
</body>
</html>
