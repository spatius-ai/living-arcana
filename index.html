    :root {
      color-scheme: dark;
      --ink: #f3f0e8;
      --ink-muted: rgba(243, 240, 232, 0.58);
      --line: rgba(243, 240, 232, 0.18);
      --accent: #a68cff;
      --accent-soft: rgba(166, 140, 255, 0.22);
      --surface: #0b0e0d;
      --serif: "Instrument Serif", "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      --sans: "Inclusive Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.86, 0, 0.07, 1);
      --card-flip-ease: cubic-bezier(0.455, 0.03, 0.515, 0.955);
      --ease-circ: cubic-bezier(0.075, 0.82, 0.165, 1);
      --safe-x: max(24px, env(safe-area-inset-left));
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #090b0b;
    }

    body {
      overflow: hidden;
      overflow: clip;
      color: var(--ink);
      font-family: var(--sans);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      /* Cards are pressed, held and dragged: on touch devices a long press
         would otherwise start a text selection or the iOS callout menu. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Typing, and the text a person may want to copy, stay selectable. */
    input,
    textarea,
    [contenteditable="true"],
    .reading-log-scroll,
    .legal-panel {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #c7b9ff;
      outline-offset: 4px;
    }

    #stage,
    .variant-app {
      width: 100%;
      height: 100dvh;
      min-height: 620px;
    }

    .variant-app {
      --card-radius-x: 13.4831%;
      --card-radius-y: 8.427%;
      --card-back-image: url("/assets/cards/card-back.webp");
      --home-holographic-strength: 0.68;
      --card-edge-outline: 0 0 0 1px rgba(0, 0, 0, 0.32);
      --card-edge-bevel:
        0 0 0 1px rgba(255, 255, 255, 0.09) inset,
        0 0 0 4px rgba(3, 7, 8, 0.76) inset,
        0 0 0 5px rgba(255, 255, 255, 0.035) inset,
        0 2px 3px rgba(255, 255, 255, 0.045) inset,
        0 -5px 9px rgba(0, 0, 0, 0.34) inset;
      --card-edge-bevel-compact:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 0 0 2px rgba(3, 7, 8, 0.76) inset,
        0 0 0 3px rgba(255, 255, 255, 0.03) inset,
        0 -3px 5px rgba(0, 0, 0, 0.32) inset;
      --card-edge-bevel-micro:
        0 0 0 1px rgba(255, 255, 255, 0.07) inset,
        0 0 0 2px rgba(3, 7, 8, 0.72) inset,
        0 -2px 3px rgba(0, 0, 0, 0.3) inset;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      overflow: clip;
      background: var(--surface);
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: -3;
      overflow: hidden;
      background:
        radial-gradient(70% 90% at 50% 42%, rgba(74, 80, 68, 0.26), transparent 68%),
        linear-gradient(160deg, #101513, #070908 64%);
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      inset: -18%;
      pointer-events: none;
    }

    .ambient::before {
      opacity: 0.62;
      background:
        radial-gradient(42% 33% at 21% 18%, rgba(86, 105, 93, 0.22), transparent 100%),
        radial-gradient(30% 50% at 77% 64%, rgba(74, 50, 100, 0.2), transparent 100%);
      transform: rotate(-5deg);
    }

    .ambient::after {
      inset: 0;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .ambient[data-ambient="1"] {
      background:
        radial-gradient(55% 65% at 66% 34%, rgba(69, 72, 91, 0.3), transparent 72%),
        linear-gradient(142deg, #101514, #09090c 67%);
    }

    .ambient[data-ambient="2"] {
      background:
        radial-gradient(52% 68% at 30% 63%, rgba(83, 60, 74, 0.25), transparent 72%),
        linear-gradient(165deg, #131512, #080909 72%);
    }

    .background-video {
      position: absolute;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      z-index: 1;
      transform: translate3d(var(--ambient-parallax-x, 0px), var(--ambient-parallax-y, 0px), 0);
      transition: none;
      filter: saturate(0.9) contrast(1.03) brightness(0.735);
      pointer-events: none;
      will-change: transform;
    }

    .background-video[data-visible] { opacity: 1; }
    .background-video[data-front] { z-index: 2; }
    .background-video[data-fading] {
      opacity: 0;
      transition: opacity 360ms linear;
    }

    .video-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(4, 6, 5, 0.28), transparent 30%, transparent 68%, rgba(4, 6, 5, 0.42)),
        radial-gradient(ellipse at center, transparent 22%, rgba(4, 6, 5, 0.28) 100%);
    }

    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      height: 92px;
      padding: env(safe-area-inset-top) var(--safe-x) 0;
      pointer-events: none;
    }

    .wordmark,
    .icon-nav { pointer-events: auto; }

    .wordmark {
      grid-column: 1;
      justify-self: start;
      display: inline-flex;
      align-items: center;
      min-width: 44px;
      min-height: 44px;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      opacity: 0.82;
      transition: opacity 150ms ease-out;
    }

    @media (hover: hover) and (pointer: fine) {
      .wordmark:hover { opacity: 1; }
    }

    .wordmark-logo-viewport {
      display: block;
      width: 104px;
      height: 28px;
      overflow: hidden;
      transform: translateY(-0.5px);
    }

    .wordmark-logo {
      display: block;
      width: 104px;
      max-width: none;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    .icon-nav {
      --nav-item-size: 44px;
      --nav-gap: 3px;
      --nav-padding: 4px;
      --nav-ease: cubic-bezier(0.77, 0, 0.175, 1);
      grid-column: 2;
      justify-self: center;
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, var(--nav-item-size));
      gap: var(--nav-gap);
      padding: var(--nav-padding);
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(28, 31, 33, 0.48), rgba(15, 18, 19, 0.28));
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.17),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        inset 0 -2px 3px rgba(0, 0, 0, 0.1),
        0 10px 32px rgba(0, 0, 0, 0.12);
      -webkit-backdrop-filter: blur(16px) saturate(115%);
      backdrop-filter: blur(16px) saturate(115%);
      isolation: isolate;
    }

    .nav-selection {
      position: absolute;
      top: var(--nav-padding);
      left: var(--nav-padding);
      z-index: -1;
      width: var(--nav-item-size);
      height: var(--nav-item-size);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(249, 247, 241, 0.17), rgba(249, 247, 241, 0.08));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 0 0 1px rgba(255, 255, 255, 0.07),
        0 3px 10px rgba(0, 0, 0, 0.13);
      transform: translateX(0);
      transition: transform 180ms var(--nav-ease);
      will-change: transform;
    }

    .icon-nav[data-instant] .nav-selection { transition: none; }

    .variant-app[data-view="consultation"] .nav-selection {
      transform: translateX(calc(var(--nav-item-size) + var(--nav-gap)));
    }

    .variant-app[data-view="archive"] .nav-selection {
      transform: translateX(calc((var(--nav-item-size) + var(--nav-gap)) * 2));
    }

    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--nav-item-size);
      height: var(--nav-item-size);
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: rgba(243, 240, 232, 0.54);
      cursor: pointer;
      transition: color 120ms var(--ease-out), transform 120ms var(--ease-out);
    }

    .icon-button[data-current] { color: var(--ink); }

    .icon-button:active { transform: scale(0.97); }
    .icon-button svg { width: 18px; height: 18px; stroke-width: 1.35; }
    .icon-button:focus-visible {
      outline: 1px solid rgba(213, 204, 255, 0.88);
      outline-offset: -3px;
    }

    .icon-button::after {
      content: attr(data-label);
      position: absolute;
      top: calc(100% + 9px);
      left: 50%;
      padding: 6px 8px 5px;
      border-radius: 7px;
      background: rgba(13, 16, 17, 0.68);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.09),
        0 8px 22px rgba(0, 0, 0, 0.16);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: rgba(243, 240, 232, 0.86);
      font-size: 10px;
      font-weight: 450;
      letter-spacing: 0.04em;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -3px);
      transition: opacity 140ms ease-out, transform 180ms var(--ease-out);
    }

    @media (hover: hover) and (pointer: fine) {
      .icon-button:not([data-current]):hover { color: rgba(243, 240, 232, 0.78); }
      .icon-button:hover::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .icon-button[data-current]::after {
      opacity: 0;
      transform: translate(-50%, -3px);
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .scene[aria-hidden="true"] * {
      pointer-events: none !important;
    }

    /* Hidden scenes are only visibility:hidden, so their looping animations
       (card float, breathe, orbit, voice bars) kept ticking off-screen. */
    .scene[aria-hidden="true"] *,
    .scene[aria-hidden="true"] *::before,
    .scene[aria-hidden="true"] *::after {
      animation-play-state: paused !important;
    }

    .variant-app[data-view="today"] .scene:not(.today-view) *,
    .variant-app[data-view="reading"] .scene:not(.reading-view) *,
    .variant-app[data-view="consultation"] .scene:not(.consultation-view) *,
    .variant-app[data-view="archive"] .scene:not(.archive-view) * {
      pointer-events: none !important;
    }

    .variant-app[data-view="today"] .today-view,
    .variant-app[data-view="reading"] .reading-view,
    .variant-app[data-view="consultation"] .consultation-view,
    .variant-app[data-view="archive"] .archive-view {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .variant-app[data-view="reading"][data-landing-exit="true"] .today-view {
      z-index: 2;
      opacity: 1;
      visibility: visible;
      pointer-events: none;
    }

    .variant-app[data-view="reading"][data-landing-exit="true"] .reading-view {
      z-index: 1;
    }

    .landing-view {
      display: grid;
      place-items: center;
      padding: 96px 24px;
    }

    .today-fresh,
    .today-drawn {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 96px 24px;
    }

    .today-fresh {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .today-drawn {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .variant-app[data-drawn="true"] .today-fresh {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .variant-app[data-drawn="true"] .today-drawn {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .landing-content {
      display: grid;
      justify-items: center;
      gap: 34px;
      width: min(100%, 840px);
      min-width: 0;
      text-align: center;
    }

    .hero-kicker,
    .today-drawn-kicker {
      margin: 0;
      color: var(--ink-muted);
      font-size: 10px;
      font-weight: 540;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .landing-cta {
      margin: 0;
      width: 100%;
      max-width: 800px;
      min-width: 0;
      font-family: var(--serif);
      font-size: clamp(48px, 7.3vw, 112px);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.052em;
      text-wrap: balance;
    }

    .landing-cta [data-word-index="4"],
    .landing-cta [data-word-index="5"] {
      font-style: italic;
    }

    .landing-reveal-button {
      opacity: 0;
      filter: blur(var(--landing-button-blur, 6px));
      transform: translate3d(0, 10px, 0) scale(0.985);
    }

    /* The button entrance is armed by the boot veil lifting; running it from
       CSS load would finish invisibly beneath the veil. */
    .variant-app[data-entered="true"] .landing-reveal-button {
      animation: landing-button-reveal var(--landing-button-duration, 720ms) cubic-bezier(.23,1,.32,1) var(--landing-button-delay, 1.18s) forwards;
    }

    @keyframes landing-button-reveal {
      to {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0, 0) scale(1);

    .live-status {

      text-transform: uppercase;

    .card-reveal-prompt {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 88%;

      font-weight: 600;
      letter-spacing: 0.14em;

    .card-reveal-copy {

      opacity: 0;
      transform: translateY(4px) scale(0.99);
    }

    .card-reveal-character {
      display: inline-block;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(5px) scale(0.98);
      will-change: filter, transform, opacity;

    .variant-app[data-card-state="back"] .card-reveal-prompt { opacity: 1; }
    .variant-app[data-card-state="flipping"] .card-reveal-prompt {
      opacity: 0;
      transition: opacity 140ms ease-out;
    }
    .variant-app[data-card-state="back"] .card-reveal-prompt::before {
      animation: card-prompt-aura 1100ms cubic-bezier(0.32, 0.72, 0, 1) 120ms both;
    }
    .variant-app[data-card-state="back"] .card-reveal-copy {
      animation:
        card-prompt-copy-in 360ms cubic-bezier(0.32, 0.72, 0, 1) 140ms both,
        card-prompt-breathe 4000ms ease-in-out 1600ms infinite alternate both;
    }
    .variant-app[data-card-state="back"] .card-reveal-character {
      animation: card-prompt-character-in 680ms cubic-bezier(0.32, 0.72, 0, 1) both;
      animation-delay: calc(180ms + var(--character-index) * 24ms);
    }

    .reading-copy {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      align-content: center;
      max-width: 510px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 150ms ease-in, transform 150ms ease-in;
    }

    .reading-stack {
      --reading-qa-shift: 80px;
      display: grid;
      gap: 24px;
      width: 100%;
      transform: translateY(var(--reading-qa-shift));
    }

    .variant-app[data-qa="ready"] .reading-stack,
    .variant-app[data-qa="answered"] .reading-stack {
      transform: translateY(0);
      transition: transform 420ms cubic-bezier(0.455, 0.03, 0.515, 0.955) 70ms;
    }

    .variant-app[data-card-state="activating"] .reading-copy,
    .variant-app[data-card-state="live"] .reading-copy {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition: opacity 330ms 180ms var(--ease-out), transform 330ms 180ms var(--ease-out);
    }

    .variant-app[data-reading-media="reversing"] .reading-copy {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition-delay: 0ms;
    }

    /* Reset the hidden reading scene before it is made visible again. */
    .variant-app[data-reading-copy-prepared="true"] .reading-copy {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: none;
    }

    .reading-kicker {
      margin: 0;

      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .reading-stack > header {
      display: grid;
      gap: 12px;
    }

    .reading-title {
      margin: 0;

      line-height: 0.94;
      letter-spacing: -0.045em;

    .reading-lead {

      color: rgba(243, 240, 232, 0.78);

    .tips {

      gap: 10px;

    .tips li::before {
      content: attr(data-index);

    .speech-line {

    .voice-bars { display: inline-flex; align-items: center; gap: 2px; height: 12px; }
    .voice-bars i { width: 1px; height: 4px; background: currentColor; }

    .variant-app[data-speaking="true"] .voice-bars i {
      animation: voice 480ms ease-in-out infinite alternate;

    .variant-app[data-speaking="true"] .voice-bars i:nth-child(2) { animation-delay: -160ms; }
    .variant-app[data-speaking="true"] .voice-bars i:nth-child(3) { animation-delay: -320ms; }

    @keyframes voice { to { height: 11px; } }

    .qa-block {
      display: grid;
      gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      opacity: 0;
      visibility: hidden;
      filter: blur(3px);
      transform: translateY(10px);
      pointer-events: none;
      transition:
        opacity 170ms ease-in,
        filter 170ms ease-in,
        transform 170ms ease-in,
        visibility 0s linear 170ms;
    }

    .variant-app[data-qa="ready"] .qa-block,
    .variant-app[data-qa="answered"] .qa-block {
      opacity: 1;
      visibility: visible;
      filter: blur(0);
      transform: translateY(0);
      pointer-events: auto;
      transition:
        opacity 380ms cubic-bezier(0.215, 0.61, 0.355, 1) 190ms,
        filter 380ms cubic-bezier(0.215, 0.61, 0.355, 1) 190ms,
        transform 380ms cubic-bezier(0.215, 0.61, 0.355, 1) 190ms,

    .qa-label {

    .qa-form {

    .qa-input {
      width: 100%;
      height: 44px;

      line-height: 1.55;

    .archive-view {
      display: grid;
      place-items: center;
      padding: 94px 0 74px;
    }

    .archive-meta {
      position: absolute;
      top: 104px;
      left: 50%;
      translate: -50% 0;
      z-index: 4;
      display: grid;
      justify-items: center;
      gap: 5px;
      pointer-events: none;

    .archive-meta h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 4vw, 56px);
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .archive-meta p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .archive-arc {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7vh;
      height: min(68vh, 620px);
      perspective: 1300px;
      transition: opacity 220ms ease-out;
    }

    .archive-webgl-stage {
      position: absolute;
      inset: 74px 0 0;
      z-index: 3;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        rgba(0, 0, 0, 0.08) 12px,
        rgba(0, 0, 0, 0.25) 28px,
        rgba(0, 0, 0, 0.55) 48px,
        rgba(0, 0, 0, 0.82) 70px,
        black 96px
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        rgba(0, 0, 0, 0.08) 12px,
        rgba(0, 0, 0, 0.25) 28px,
        rgba(0, 0, 0, 0.55) 48px,
        rgba(0, 0, 0, 0.82) 70px,
        black 96px
      );
      transition: opacity 280ms var(--ease-out);
    }

    .archive-webgl-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(5, 8, 7, 0.32), transparent 14%, transparent 86%, rgba(5, 8, 7, 0.32)),
        linear-gradient(180deg, rgba(5, 8, 7, 0.12), transparent 28%, transparent 72%, rgba(5, 8, 7, 0.18));
    }

    .archive-webgl-stage::before {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 3;
      height: clamp(78px, 14vh, 132px);
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(5, 8, 7, 0),
        rgba(5, 8, 7, 0.035) 28%,
        rgba(5, 8, 7, 0.12) 62%,
        rgba(5, 8, 7, 0.28)
      );
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      -webkit-mask-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.22) 26%, black 100%);
      mask-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.22) 26%, black 100%);
    }

    .archive-webgl-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      outline: none;
    }

    }

    .archive-webgl-help {

      left: 50%;
      bottom: max(64px, calc(env(safe-area-inset-bottom) + 54px));
      z-index: 4;
      margin: 0;
      translate: -50% 0;
      color: rgba(243, 240, 232, 0.56);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 180ms ease-out;
    }

    .archive-webgl-stage[data-focused] .archive-webgl-help { opacity: 0; }

    .archive-webgl-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;

    .variant-app[data-archive-webgl="ready"] .archive-webgl-stage {
      opacity: 1;
      pointer-events: auto;
    }

    .variant-app[data-archive-webgl="loading"] .archive-arc {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .variant-app[data-archive-webgl="ready"] .archive-arc {
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      opacity: 0;
      pointer-events: none;

    .archive-card {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: clamp(116px, 10vw, 162px);
      aspect-ratio: 0.625;
      padding: 0;

      border-radius: var(--card-radius-x) / var(--card-radius-y);

      transform-origin: 50% 160%;
      cursor: pointer;
      will-change: transform;

      padding: 13px 11px 10px;
      overflow: hidden;
      border: 0;
      border-radius: inherit;
      color: #202420;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.32), transparent 24%),
        linear-gradient(155deg, #cfc8b9, #8f978c 70%, #a08c9d);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.38),

    .archive-card-artwork,
    .focus-card-artwork,

    .focus-front[data-video-ready] .focus-card-artwork { opacity: 0; }
    .focus-front[data-video-ready] .focus-card-video { opacity: 1; }

    .archive-card:not([data-collected]) .archive-card-inner {

    .archive-card:focus-visible { outline-offset: 7px; }

    .archive-roman,
    .archive-name {

      z-index: 1;

      letter-spacing: 0.09em;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.78);
      text-transform: uppercase;

    .archive-name { grid-row: 3; text-align: center; }

    .overlay {

      padding: 72px 24px;

    /* Boot veil — static markup in <body>, so it paints before any JS runs.
       The cosmic orb is portaled in by React once the bundle arrives; until
       then the CSS aura + glyph + percent counter carry the loading state.
       Dismissed by App once the background video has presented a frame. */
    #boot-veil {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-content: center;
      justify-items: center;
      row-gap: 28px;
      background: #090b0b;
      transition: opacity 640ms var(--ease-out), visibility 0s 640ms;
    }

    #boot-veil[data-leaving] {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-veil-core {
      position: relative;
      display: grid;
      place-items: center;
      width: 120px;
      height: 120px;
      transition: transform 640ms var(--ease-out);
    }

    #boot-veil[data-leaving] .boot-veil-core { transform: scale(1.05); }

    /* Same radial recipe as .cosmic-mic-aura, scaled to the veil orb. */
    .boot-veil-aura {
      position: absolute;
      inset: -22px;
      z-index: 0;
      display: block;
      border-radius: 50%;
      background: radial-gradient(circle at 46% 43%, rgba(225, 216, 255, 0.36) 0%, rgba(160, 128, 255, 0.3) 20%, rgba(106, 60, 255, 0.22) 40%, rgba(60, 224, 255, 0.1) 57%, rgba(255, 94, 168, 0.045) 65%, transparent 76%);
      filter: blur(8px);
      opacity: 0.32;
      pointer-events: none;
      animation: boot-veil-aura-breathe 2.8s ease-in-out infinite;
    }

    .boot-veil-orb-slot {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }

    .boot-veil-orb,
    .boot-veil-orb canvas {
      display: block;
      width: 120px !important;
      height: 120px !important;
      border-radius: 50%;
    }

    .boot-veil-orb {
      filter: drop-shadow(0 0 8px rgba(215, 201, 255, 0.4)) drop-shadow(0 0 18px rgba(106, 60, 255, 0.25));
      animation: boot-veil-orb-in 480ms var(--ease-out) both;
    }

    .boot-veil-glyph {
      position: relative;
      z-index: 2;
      width: 30px;
      height: auto;
      color: #fff;
      filter: drop-shadow(0 1px 6px rgba(9, 11, 11, 0.5));
    }

    .boot-veil-progress {
      margin: 0;
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
      min-width: 3.4em;
      text-align: center;
    }

    /* Sits in the veil grid right under the percent counter. The entrance
       animates transform only and the breathe animates opacity only, so the
       two never fight; with animation: none (reduced motion) the base
       styles show the hint statically. */
    .boot-veil-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 4px 0 0;
      color: var(--ink);
      font-size: 11px;
      font-weight: 540;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      animation:
        boot-veil-hint-in 900ms var(--ease-out) 500ms both,
        boot-veil-hint-breathe 2.8s ease-in-out 500ms infinite both;
    }

    .boot-veil-hint svg {
      width: 15px;
      height: 15px;
      flex: none;
    }

    @keyframes boot-veil-hint-in {
      from { transform: translateY(6px); }
    }

    @keyframes boot-veil-hint-breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.95; }
    }

    @keyframes boot-veil-aura-breathe {
      0%, 100% { opacity: 0.26; }
      50% { opacity: 0.42; }
    }

    @keyframes boot-veil-orb-in {
      from {
        opacity: 0;
        transform: scale(0.94);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .today-card-video,
      .return-card-video,
      .focus-card-video { display: none; }
      .today-hover-material { display: none; }
      .card-back-metal-canvas,
      .card-front-diffraction-canvas,
      .source-card-diffraction-canvas,
      .focus-back-metal-canvas,
      .focus-front-diffraction-canvas { display: none; }
      .archive-webgl-stage { display: none; }
      .nav-selection { transition: none; }
      .variant-app[data-card-state="back"] .card-reveal-copy,
      .variant-app[data-card-state="back"] .card-reveal-character {
        opacity: 1;
        filter: none;
        transform: none;
      }
      .landing-reveal-button {
        opacity: 1;
        filter: none;
        transform: none;
      }
    }

  </style>

<body>
  <div id="boot-veil" aria-hidden="true">
    <div class="boot-veil-core">
      <i class="boot-veil-aura"></i>
      <div class="boot-veil-orb-slot"></div>
      <svg class="boot-veil-glyph" viewBox="0 0 24 32" aria-hidden="true">
        <rect x="1.25" y="1.25" width="21.5" height="29.5" rx="4.5" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 10.5c.74 3.7 1.76 4.76 5.5 5.5-3.74.74-4.76 1.76-5.5 5.5-.74-3.74-1.76-4.76-5.5-5.5 3.74-.74 4.76-1.76 5.5-5.5Z" fill="currentColor" />
      </svg>
    </div>
    <p class="boot-veil-progress" id="boot-veil-progress">0%</p>
    <p class="boot-veil-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 13.5V12a8 8 0 0 1 16 0v1.5" />
        <rect x="3" y="13.5" width="4.5" height="6.5" rx="2" />
        <rect x="16.5" y="13.5" width="4.5" height="6.5" rx="2" />
      </svg>
      <span>Best experienced with headphones</span>
    </p>
  </div>
  <script>
    // Boot progress counter. Classic script so it starts during HTML parse,
    // long before the module bundle lands. Creeps on a clock while nothing is
    // known, then follows the two real downloads — background video buffering
    // and the digital human preload (AvatarKit SDK + avatar assets) — and
    // sprints to 100 on arcana:boot-ready.
    (function () {
      var label = document.getElementById("boot-veil-progress");
      if (!label) return;
      var displayed = 0;
      var video = 0;
      var avatar = 0;
      var done = false;
      var start = performance.now();

      function tick(now) {
        var creep = 60 * (1 - Math.exp(-(now - start) / 3200));
        var known = video > 0 || avatar > 0;
        var real = known ? 20 + (video * 0.5 + avatar * 0.5) * 78 : 0;
        var target = done ? 100 : Math.max(creep, real);
        if (target > displayed) displayed += (target - displayed) * (done ? 0.16 : 0.06);
        var shown = Math.min(100, Math.round(displayed));
        label.textContent = shown + "%";
        if (done && shown >= 100) return;
        window.requestAnimationFrame(tick);
      }

      function track(name, assign) {
        window.addEventListener(name, function (event) {
          var fraction = Number(event.detail);
          if (Number.isFinite(fraction)) assign(Math.min(1, Math.max(0, fraction)));
        });
      }

      track("arcana:background-progress", function (fraction) { video = Math.max(video, fraction); });
      track("arcana:avatar-progress", function (fraction) { avatar = Math.max(avatar, fraction); });
      window.addEventListener("arcana:background-ready", function () { video = 1; }, { once: true });
      window.addEventListener("arcana:avatar-ready", function () { avatar = 1; }, { once: true });
      window.addEventListener("arcana:boot-ready", function () { done = true; }, { once: true });
      window.requestAnimationFrame(tick);
    })();
  </script>
  <div id="stage"></div>

  <script type="module">
    const [
      {
        CARD_NAMES,
        hasCompletedDailyDraw,
        isCardIndexCollected,
        recordDailyDraw,
        SELECTED_DIRECTION,
        TAROT_CARDS,
        VIDEO_LIBRARY
      },
      { CARD_BACK_THUMBNAIL_URL },
      { CARD_RADIUS_CHANGE_EVENT },
      { createCardHoverMaterial },
      { createDualFaceCardMaterial },
      { runActivationShader },
      { uiSfx }
    ] = await Promise.all([
      import("/src/data/tarot.js"),
      import("/src/cardBackMetalShader.js"),
      import("/src/cardArtworkTuning.js"),
      import("/src/cardHoverMaterial.js"),
      import("/src/dualFaceCardMaterial.js"),
      import("/src/motion/runActivationShader.js"),
      import("/src/audio/uiSfx.js")
    ]);
    window.TAROT_VIDEO_LIBRARY = VIDEO_LIBRARY;

    function layoutArchive(app) {
      const cards = [...app.querySelectorAll(".archive-card")];
      const width = window.innerWidth;
      const compact = width < 820;
      const spacing = compact ? Math.max(40, width * 0.13) : Math.min(69, width * 0.047);
      const center = (cards.length - 1) / 2;

      cards.forEach((card, index) => {
        const offset = index - center;
        const y = Math.pow(Math.abs(offset), 1.64) * (compact ? 2.8 : 2.1) * 0.55;
        const rotation = offset * 0.72;
        card.style.transform = `translate3d(${offset * spacing - card.offsetWidth / 2}px, ${y}px, 0) rotate(${rotation}deg)`;
        card.style.zIndex = String(50 - Math.round(Math.abs(offset)));
      });
    }

    let threeModulePromise = null;

    function loadThreeModule() {
      if (!threeModulePromise) {
        // Locally locked dependency (see package.json); previously loaded at
        // runtime from jsDelivr, which broke under offline/strict-CSP setups.
        threeModulePromise = import("three");
      }
      return threeModulePromise;
    }

    function roundRectPath(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function loadArchiveImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = "async";
        image.addEventListener("load", () => resolve(image), { once: true });
        image.addEventListener("error", () => reject(new Error(`Unable to load archive artwork: ${source}`)), { once: true });
        image.src = source;
      });
    }

    function drawCoverImage(ctx, image, width, height) {
      const coverScale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const drawWidth = image.naturalWidth * coverScale;
      const drawHeight = image.naturalHeight * coverScale;
      ctx.drawImage(image, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
    }

    function drawArchiveCardOverlay(ctx, index, cornerRadius = 38) {
      const collected = isCardIndexCollected(index);
      const [roman, name] = CARD_NAMES[index];
      ctx.save();
      const topShade = ctx.createLinearGradient(0, 0, 0, 118);
      topShade.addColorStop(0, "rgba(5, 7, 7, .36)");
      topShade.addColorStop(1, "rgba(5, 7, 7, 0)");
      ctx.fillStyle = topShade;
      ctx.fillRect(0, 0, 512, 122);
      const bottomShade = ctx.createLinearGradient(0, 690, 0, 820);
      bottomShade.addColorStop(0, "rgba(5, 7, 7, 0)");
      bottomShade.addColorStop(1, "rgba(5, 7, 7, .42)");
      ctx.fillStyle = bottomShade;
      ctx.fillRect(0, 680, 512, 140);
      ctx.strokeStyle = "rgba(247,242,229,.62)";
      ctx.lineWidth = 3;
      roundRectPath(ctx, 10, 10, 492, 800, Math.max(0, cornerRadius - 2));
      ctx.stroke();
      ctx.fillStyle = "rgba(248,245,236,.94)";
      ctx.shadowColor = "rgba(0,0,0,.78)";
      ctx.shadowBlur = 8;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "500 24px 'Inclusive Sans', sans-serif";
      ctx.letterSpacing = "3px";
      ctx.fillText(`${roman} · MAJOR ARCANA`, 256, 64);
      ctx.font = "500 23px 'Inclusive Sans', sans-serif";
      ctx.fillText(collected ? name.toUpperCase() : "NOT YET AWAKENED", 256, 758);
      ctx.restore();
    }

    function makeArchiveCardCanvas(index, image, canvas = document.createElement("canvas"), cornerRadius = 38) {
      canvas.width = 512;
      canvas.height = 820;
      const ctx = canvas.getContext("2d");
      const collected = isCardIndexCollected(index);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.fillStyle = "#d8d0c0";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.filter = collected ? "none" : "grayscale(1)";
      ctx.translate(canvas.width * 0.5, canvas.height * 0.5);
      drawCoverImage(ctx, image, canvas.width, canvas.height);
      ctx.restore();
      drawArchiveCardOverlay(ctx, index, cornerRadius);
      return canvas;
    }

    function makeArchiveMotionOverlayCanvas(index, cornerRadius = 38) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 820;
      drawArchiveCardOverlay(canvas.getContext("2d"), index, cornerRadius);
      return canvas;
    }

    function makeArchiveBackCanvas(image) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 820;
      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      drawCoverImage(ctx, image, canvas.width, canvas.height);
      ctx.restore();
      return canvas;
    }

    async function setupArchiveScene(app) {
      const THREE = await loadThreeModule();
      const stage = app.querySelector(".archive-webgl-stage");
      const canvas = stage.querySelector(".archive-webgl-canvas");
      const status = stage.querySelector(".archive-webgl-status");
      const archiveFallback = app.querySelector(".archive-arc");
      const motionVideo = document.createElement("video");
      motionVideo.muted = true;
      motionVideo.loop = true;
      motionVideo.playsInline = true;
      motionVideo.preload = "metadata";
      const [backImage, ...frontImages] = await Promise.all([
        // Textures are 512×820 canvases, so the grid loads matching
        // thumbnails (~1.8 MB in total) instead of 23 full-size images (~9 MB).
        loadArchiveImage(CARD_BACK_THUMBNAIL_URL),
        ...TAROT_CARDS.map(card => loadArchiveImage(card.composition.thumbnailArtworkUrl)),
      ]);
      const compactQuery = window.matchMedia("(max-width: 820px)");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, compactQuery.matches ? 1.5 : 2));
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(39, 1, 0.1, 40);
      camera.position.set(0, 0, 9.6);

      const geometry = new THREE.PlaneGeometry(1.22, 1.952, 1, 1);
      const textureLoaderMax = renderer.capabilities.getMaxAnisotropy();
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2(2, 2);
      const readArchiveCornerRadius = () => {
        const style = getComputedStyle(app);
        const normalized = (property, fallback) => {
          const value = style.getPropertyValue(property).trim();
          if (value.endsWith("%")) {
            const number = Number.parseFloat(value);
            if (Number.isFinite(number)) return number / 100;
          }
          return fallback;
        };
        return new THREE.Vector2(
          normalized("--card-radius-x", 48 / 356),
          normalized("--card-radius-y", (48 / 356) * 0.625),
        );
      };
      const archiveCornerRadius = readArchiveCornerRadius();
      const cards = [];
      const hitMeshes = [];
      const cardVertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;
      const roundedCardMaskShader = `
        uniform vec2 uCornerRadius;

        float roundedCardMask(vec2 uv) {
          vec2 radius = max(uCornerRadius, vec2(0.0001));
          vec2 cornerCenter = vec2(0.5) - radius;
          vec2 cornerOffset = max(abs(uv - 0.5) - cornerCenter, vec2(0.0));
          float ellipse = length(cornerOffset / radius);
          return 1.0 - smoothstep(0.985, 1.0, ellipse);
        }

        vec3 applyCardEdgeBevel(vec3 color, vec2 uv) {
          float horizontalEdge = min(uv.x, 1.0 - uv.x);
          float verticalEdge = min(uv.y, 1.0 - uv.y) * 1.6;
          float edgeDistance = min(horizontalEdge, verticalEdge);
          float darkBevel = 1.0 - smoothstep(0.0035, 0.014, edgeDistance);
          float fineHighlight = 1.0 - smoothstep(0.0, 0.0025, edgeDistance);
          color = mix(color, color * 0.24, darkBevel);
          return color + vec3(0.045) * fineHighlight;
        }
      `;
      const cardFragmentShader = `
        uniform sampler2D uMap;
        uniform vec2 uPointer;
        uniform float uHover;
        uniform float uDim;
        uniform float uOpacity;
        uniform float uSoftness;
        uniform float uLocked;
        varying vec2 vUv;
        ${roundedCardMaskShader}
        void main() {
          float blurStrength = uSoftness * uSoftness;
          vec2 blurStep = vec2(0.013, 0.0085) * blurStrength;
          vec4 texel = texture2D(uMap, vUv) * 0.28;
          texel += texture2D(uMap, vUv + vec2( blurStep.x, 0.0)) * 0.12;
          texel += texture2D(uMap, vUv + vec2(-blurStep.x, 0.0)) * 0.12;
          texel += texture2D(uMap, vUv + vec2(0.0,  blurStep.y)) * 0.12;
          texel += texture2D(uMap, vUv + vec2(0.0, -blurStep.y)) * 0.12;
          texel += texture2D(uMap, vUv + vec2( blurStep.x,  blurStep.y)) * 0.06;
          texel += texture2D(uMap, vUv + vec2(-blurStep.x,  blurStep.y)) * 0.06;
          texel += texture2D(uMap, vUv + vec2( blurStep.x, -blurStep.y)) * 0.06;
          texel += texture2D(uMap, vUv + vec2(-blurStep.x, -blurStep.y)) * 0.06;
          float cornerMask = roundedCardMask(vUv);
          if (texel.a < 0.02 || cornerMask < 0.001) discard;
          float radial = 1.0 - smoothstep(0.0, 0.52, distance(vUv, uPointer));
          float diagonal = 1.0 - smoothstep(0.0, 0.085, abs((vUv.x + vUv.y) - (0.82 + uPointer.x * 0.35)));
          float sheen = (radial * 0.18 + diagonal * 0.10) * uHover;
          float luminance = dot(texel.rgb, vec3(0.2126, 0.7152, 0.0722));
          vec3 faceColor = mix(texel.rgb, vec3(luminance), uLocked);
          vec3 color = faceColor * uDim + vec3(0.72, 0.66, 1.0) * sheen;
          color = applyCardEdgeBevel(color, vUv);
          gl_FragColor = vec4(color, texel.a * uOpacity * cornerMask);
          #include <colorspace_fragment>
        }
      `;
      const cardMotionFragmentShader = `
        uniform sampler2D uMap;
        uniform sampler2D uMask;
        uniform float uOpacity;
        uniform float uLocked;
        varying vec2 vUv;
        ${roundedCardMaskShader}
        void main() {
          vec4 texel = texture2D(uMap, vUv);
          // VideoTexture cannot use the GPU's sRGB internal format. Built-in
          // Three materials decode it in map_fragment, but this custom shader
          // owns the sampler, so bring the video into linear space explicitly
          // before matching it to the static card texture and output transform.
          texel = sRGBTransferEOTF(texel);
          float mask = texture2D(uMask, vUv).a;
          float cornerMask = roundedCardMask(vUv);
          if (mask < 0.02 || uOpacity < 0.001 || cornerMask < 0.001) discard;
          float luminance = dot(texel.rgb, vec3(0.2126, 0.7152, 0.0722));
          vec3 color = mix(texel.rgb, vec3(luminance), uLocked);
          color = applyCardEdgeBevel(color, vUv);
          gl_FragColor = vec4(color, texel.a * mask * uOpacity * cornerMask);
          #include <colorspace_fragment>
        }
      `;
      const cardBackFragmentShader = `
        uniform sampler2D uMap;
        uniform vec2 uPointer;
        uniform float uIntensity;
        uniform float uDim;
        uniform float uOpacity;
        uniform float uSoftness;
        varying vec2 vUv;
        ${roundedCardMaskShader}

        float hash(vec2 value) {
          return fract(sin(dot(value, vec2(127.1, 311.7))) * 43758.5453123);
        }

        void main() {
          float blurStrength = uSoftness * uSoftness;
          vec2 blurStep = vec2(0.013, 0.0085) * blurStrength;
          vec4 texel = texture2D(uMap, vUv) * 0.28;
          texel += texture2D(uMap, vUv + vec2( blurStep.x, 0.0)) * 0.12;
          texel += texture2D(uMap, vUv + vec2(-blurStep.x, 0.0)) * 0.12;
          texel += texture2D(uMap, vUv + vec2(0.0,  blurStep.y)) * 0.12;
          texel += texture2D(uMap, vUv + vec2(0.0, -blurStep.y)) * 0.12;
          texel += texture2D(uMap, vUv + vec2( blurStep.x,  blurStep.y)) * 0.06;
          texel += texture2D(uMap, vUv + vec2(-blurStep.x,  blurStep.y)) * 0.06;
          texel += texture2D(uMap, vUv + vec2( blurStep.x, -blurStep.y)) * 0.06;
          texel += texture2D(uMap, vUv + vec2(-blurStep.x, -blurStep.y)) * 0.06;
          float cornerMask = roundedCardMask(vUv);
          if (texel.a < 0.02 || cornerMask < 0.001) discard;

          vec3 source = texture2D(uMap, vUv).rgb;
          float maximum = max(source.r, max(source.g, source.b));
          float minimum = min(source.r, min(source.g, source.b));
          float chroma = maximum - minimum;
          float luminance = dot(source, vec3(0.2126, 0.7152, 0.0722));
          float warm = smoothstep(0.025, 0.16, source.r - source.b)
            * smoothstep(-0.035, 0.095, source.r - source.g);
          float material = warm
            * smoothstep(0.035, 0.19, chroma)
            * smoothstep(0.16, 0.64, luminance);
          vec2 edgeDistance = abs(vUv - 0.5) * 2.0;
          float sideFrame = smoothstep(0.69, 0.84, edgeDistance.x);
          float horizontalFrame = smoothstep(0.80, 0.91, edgeDistance.y);
          float metalMask = material * max(sideFrame, horizontalFrame);
          vec2 lightAxis = normalize(vec2(0.84, 0.54));
          float distanceToSweep = abs(dot(vUv - uPointer, lightAxis));
          float narrowSweep = 1.0 - smoothstep(0.018, 0.13, distanceToSweep);
          float broadReflection = 1.0 - smoothstep(0.08, 0.48, distance(vUv, uPointer));
          float grain = mix(0.82, 1.12, hash(floor(vUv * vec2(760.0, 1216.0))));
          float reflection = metalMask
            * (0.025 + uIntensity * (narrowSweep * 0.72 + broadReflection * 0.1))
            * grain;
          vec3 warmGold = vec3(1.0, 0.66, 0.29);
          vec3 paleEdge = vec3(1.0, 0.92, 0.73);
          vec3 reflectionColor = mix(warmGold, paleEdge, smoothstep(0.38, 0.82, luminance));
          vec3 baseColor = texel.rgb * uDim;
          vec3 color = mix(baseColor, reflectionColor, clamp(reflection, 0.0, 0.7));
          color = applyCardEdgeBevel(color, vUv);
          gl_FragColor = vec4(color, texel.a * uOpacity * cornerMask);
          #include <colorspace_fragment>
        }
      `;

      const makeTexture = source => {
        const texture = new THREE.CanvasTexture(source);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = Math.min(8, textureLoaderMax);
        texture.needsUpdate = true;
        return texture;
      };

      const makeMaterial = (texture, fragmentShader = cardFragmentShader, locked = false) => new THREE.ShaderMaterial({
        uniforms: {
          uMap: { value: texture },
          uPointer: { value: new THREE.Vector2(0.5, 0.5) },
          uHover: { value: 0 },
          uIntensity: { value: 0.12 },
          uDim: { value: 1 },
          uOpacity: { value: 1 },
          uSoftness: { value: 0 },
          uLocked: { value: locked ? 1 : 0 },
          uCornerRadius: { value: archiveCornerRadius }
        },
        vertexShader: cardVertexShader,
        fragmentShader,
        transparent: true,
        depthWrite: true,
        side: THREE.FrontSide
      });

      const makeMotionMaterial = (videoTexture, maskTexture, locked) => new THREE.ShaderMaterial({
        uniforms: {
          uMap: { value: videoTexture },
          uMask: { value: maskTexture },
          uOpacity: { value: 0 },
          uLocked: { value: locked ? 1 : 0 },
          uCornerRadius: { value: archiveCornerRadius }
        },
        vertexShader: cardVertexShader,
        fragmentShader: cardMotionFragmentShader,
        transparent: true,
        depthWrite: false,
        side: THREE.FrontSide
      });

      const backTexture = makeTexture(makeArchiveBackCanvas(backImage));
      CARD_NAMES.forEach((_, index) => {
        const row = index < 11 ? 0 : 1;
        const column = index % 11;
        const frontCanvas = makeArchiveCardCanvas(index, frontImages[index], undefined, archiveCornerRadius.x * 512);
        const frontTexture = makeTexture(frontCanvas);
        const instances = [-1, 0, 1].map(copy => {
          const group = new THREE.Group();
          /* Do not rely on CanvasRenderingContext2D.filter for the collection
             state: iOS Safari can ignore it. The shader owns the grayscale
             invariant so every unawakened card is correct in the ring and
             while focused. */
          const frontMaterial = makeMaterial(frontTexture, cardFragmentShader, !isCardIndexCollected(index));
          const backMaterial = makeMaterial(backTexture, cardBackFragmentShader);
          const front = new THREE.Mesh(geometry, frontMaterial);
          const back = new THREE.Mesh(geometry, backMaterial);
          front.position.z = 0.008;
          back.position.z = -0.008;
          back.rotation.y = Math.PI;
          front.userData.cardIndex = index;
          back.userData.cardIndex = index;
          front.userData.copy = copy;
          back.userData.copy = copy;
          group.add(front, back);
          group.renderOrder = row === 0 ? 1 : 2;
          scene.add(group);
          hitMeshes.push(front, back);
          return { copy, group, frontMaterial, backMaterial };
        });
        cards.push({
          index, row, column, frontCanvas, frontImage: frontImages[index], frontTexture, instances,
          hover: 0,
          pointer: new THREE.Vector2(0.5, 0.5)
        });
      });

      const state = {
        active: false,
        destroyed: false,
        dragging: false,
        dragRow: null,
        moved: false,
        pointerId: null,
        pointerStartX: 0,
        lastX: 0,
        lastTime: 0,
        dragSoundTravel: 0,
        dragSoundTick: 0,
        offsets: [0, 0.72],
        velocities: [-0.105, 0.082],
        autoSpeeds: [-0.105, 0.082],
        hoveredIndex: null,
        selectedIndex: null,
        selectedCopy: null,
        motionIndex: null,
        motionLoadToken: 0,
        motionReady: false,
        motionImmediate: false,
        motionMix: 0,
        motionTexture: null,
        motionMaterial: null,
        motionMesh: null,
        motionOverlayTexture: null,
        motionOverlayMaterial: null,
        motionOverlayMesh: null,
        focus: 0,
        focusTarget: 0,
        flip: 0,
        flipTarget: 0,
        visibleHalfWidth: 6.2,
        keyboardIndex: 5,
        frame: 0,
        lastFrameTime: performance.now()
      };

      const lerp = (a, b, t) => a + (b - a) * t;
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const damp = (value, target, speed, dt) => lerp(value, target, 1 - Math.exp(-speed * dt));
      const spacing = () => compactQuery.matches ? 1.26 : 1.58;
      const wrap = (value, length) => ((value + length / 2) % length + length) % length - length / 2;

      function disposeFocusedMotionLayers() {
        state.motionMesh?.removeFromParent();
        state.motionOverlayMesh?.removeFromParent();
        state.motionMaterial?.dispose();
        state.motionOverlayMaterial?.dispose();
        state.motionTexture?.dispose();
        state.motionOverlayTexture?.dispose();
        state.motionTexture = null;
        state.motionMaterial = null;
        state.motionMesh = null;
        state.motionOverlayTexture = null;
        state.motionOverlayMaterial = null;
        state.motionOverlayMesh = null;
      }

      function stopFocusedMotion() {
        state.motionLoadToken += 1;
        state.motionReady = false;
        state.motionImmediate = false;
        state.motionMix = 0;
        motionVideo.pause();
        motionVideo.onloadeddata = null;
        motionVideo.onerror = null;
        motionVideo.removeAttribute("src");
        motionVideo.load();
        disposeFocusedMotionLayers();
        state.motionIndex = null;
      }

      function prepareFocusedMotion(index, immediate = false) {
        const selectedCard = TAROT_CARDS[index];
        const source = selectedCard?.composition.motionVideoUrl;
        stopFocusedMotion();
        if (!source) return;

        const token = ++state.motionLoadToken;
        const collected = isCardIndexCollected(index);
        state.motionIndex = index;
        state.motionImmediate = immediate;

        const markReady = () => {
          if (token !== state.motionLoadToken || state.motionIndex !== index) return;
          const selectedInstance = cards[index]?.instances.find(instance => instance.copy === state.selectedCopy);
          if (!selectedInstance) return;

          const videoTexture = new THREE.VideoTexture(motionVideo);
          videoTexture.colorSpace = THREE.SRGBColorSpace;
          videoTexture.minFilter = THREE.LinearFilter;
          videoTexture.magFilter = THREE.LinearFilter;
          videoTexture.generateMipmaps = false;
          const motionMaterial = makeMotionMaterial(videoTexture, cards[index].frontTexture, !collected);
          const motionMesh = new THREE.Mesh(geometry, motionMaterial);
          motionMesh.position.z = 0.012;

          const overlayTexture = makeTexture(makeArchiveMotionOverlayCanvas(index, archiveCornerRadius.x * 512));
          const overlayMaterial = makeMaterial(overlayTexture);
          overlayMaterial.uniforms.uOpacity.value = 0;
          overlayMaterial.depthWrite = false;
          const overlayMesh = new THREE.Mesh(geometry, overlayMaterial);
          overlayMesh.position.z = 0.016;
          selectedInstance.group.add(motionMesh, overlayMesh);

          state.motionTexture = videoTexture;
          state.motionMaterial = motionMaterial;
          state.motionMesh = motionMesh;
          state.motionOverlayTexture = overlayTexture;
          state.motionOverlayMaterial = overlayMaterial;
          state.motionOverlayMesh = overlayMesh;
          state.motionReady = true;
          if (state.motionImmediate) {
            state.motionMix = 1;
            state.motionMaterial.uniforms.uOpacity.value = 1;
            state.motionOverlayMaterial.uniforms.uOpacity.value = 1;
          }
          invalidate();
        };
        const revealFirstFrame = () => {
          if (token !== state.motionLoadToken) return;
          Promise.resolve(motionVideo.play()).then(() => {
            if (typeof motionVideo.requestVideoFrameCallback === "function") {
              motionVideo.requestVideoFrameCallback(markReady);
            } else {
              markReady();
            }
          }).catch(() => {
            if (motionVideo.readyState >= 2) markReady();
          });
        };

        motionVideo.onloadeddata = revealFirstFrame;
        motionVideo.onerror = () => {
          if (token === state.motionLoadToken) stopFocusedMotion();
        };
        motionVideo.src = source;
        motionVideo.load();
      }

      function rowFromPointer(event, intersection = null) {
        const cardIndex = intersection?.object?.userData?.cardIndex;
        if (Number.isInteger(cardIndex)) return cards[cardIndex].row;
        const rect = canvas.getBoundingClientRect();
        return (event.clientY - rect.top) / rect.height < 0.52 ? 0 : 1;
      }

      function updatePointerFromEvent(event) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      function intersectCards() {
        raycaster.setFromCamera(pointer, camera);
        return raycaster.intersectObjects(hitMeshes, false).find(hit => {
          const index = hit.object.userData.cardIndex;
          return Number.isInteger(index) && hit.object.material.uniforms.uOpacity.value > 0.12;
        }) || null;
      }

      function setHovered(intersection) {
        const next = intersection?.object?.userData?.cardIndex;
        state.hoveredIndex = Number.isInteger(next) ? next : null;
        if (state.hoveredIndex !== null && intersection.uv) {
          cards[state.hoveredIndex].pointer.copy(intersection.uv);
        }
        canvas.style.cursor = state.dragging ? "grabbing" : state.hoveredIndex === null ? "grab" : "pointer";
      }

      function describeCard(index, prefix = "Selected") {
        const [roman, name] = CARD_NAMES[index];
        const collected = isCardIndexCollected(index);
        status.textContent = `${prefix}: ${roman}, ${collected ? name : "not yet awakened"}.`;
      }

      function focusCard(index, immediate = false, copy = null) {
        if (!Number.isInteger(index)) return;
        canvas.dispatchEvent(new CustomEvent("living-arcana:sfx", {
          bubbles: true,
          detail: { cue: "open", prepareCardFlip: true }
        }));
        state.selectedIndex = index;
        state.selectedCopy = Number.isInteger(copy)
          ? copy
          : cards[index].instances.reduce((closest, instance) =>
            Math.abs(instance.group.position.x) < Math.abs(closest.group.position.x) ? instance : closest
          ).copy;
        state.focusTarget = 1;
        state.flipTarget = 0;
        stage.setAttribute("data-focused", "");
        prepareFocusedMotion(index, immediate);
        describeCard(index);
        if (immediate) state.focus = 1;
        invalidate();
      }

      function exitFocus(immediate = false) {
        canvas.dispatchEvent(new CustomEvent("living-arcana:sfx", { bubbles: true, detail: { cue: "close" } }));
        state.focusTarget = 0;
        state.flipTarget = 0;
        state.motionImmediate = immediate;
        stage.removeAttribute("data-focused");
        status.textContent = "Returned to the Major Arcana library.";
        if (immediate) {
          stopFocusedMotion();
          state.focus = 0;
          state.flip = 0;
          state.selectedIndex = null;
          state.selectedCopy = null;
        }
        invalidate();
      }

      function toggleFocusedCard(immediate = false) {
        if (state.selectedIndex === null) return;
        state.motionImmediate = immediate;
        state.flipTarget = state.flipTarget > 0.5 ? 0 : 1;
        canvas.dispatchEvent(new CustomEvent("living-arcana:sfx", {
          bubbles: true,
          detail: { cardFlip: true }
        }));
        if (state.flipTarget > 0.5) motionVideo.pause();
        else if (state.motionReady) motionVideo.play().catch(() => {});
        describeCard(state.selectedIndex, state.flipTarget ? "Showing the reverse of" : "Showing the face of");
        invalidate();
      }

      function updateCardArtwork(cardId) {
        const index = TAROT_CARDS.findIndex(card => card.id === cardId);
        const card = cards[index];
        if (!card) return;
        makeArchiveCardCanvas(index, card.frontImage, card.frontCanvas, archiveCornerRadius.x * 512);
        card.frontTexture.needsUpdate = true;
        card.instances.forEach(instance => {
          instance.frontMaterial.uniforms.uLocked.value = isCardIndexCollected(index) ? 0 : 1;
        });
        if (index === state.motionIndex && state.motionReady) {
          state.motionMaterial.uniforms.uLocked.value = isCardIndexCollected(index) ? 0 : 1;
          state.motionOverlayTexture.image = makeArchiveMotionOverlayCanvas(index, archiveCornerRadius.x * 512);
          state.motionOverlayTexture.needsUpdate = true;
        }
        invalidate();
      }

      let radiusRedrawTimer = 0;
      const onArchiveRadiusChange = event => {
        const radiusX = Number(event.detail?.radiusX);
        const radiusY = Number(event.detail?.radiusY);
        if (Number.isFinite(radiusX) && Number.isFinite(radiusY)) {
          archiveCornerRadius.set(radiusX, radiusY);
        } else {
          archiveCornerRadius.copy(readArchiveCornerRadius());
        }

        // The shader mask updates immediately. Redraw the lightweight canvas
        // labels after the slider settles so their inset outline follows the
        // same curve without rebuilding 22 textures on every pointer event.
        window.clearTimeout(radiusRedrawTimer);
        radiusRedrawTimer = window.setTimeout(() => {
          cards.forEach(card => {
            makeArchiveCardCanvas(card.index, card.frontImage, card.frontCanvas, archiveCornerRadius.x * 512);
            card.frontTexture.needsUpdate = true;
          });
          if (state.motionOverlayTexture && state.motionIndex !== null) {
            state.motionOverlayTexture.image = makeArchiveMotionOverlayCanvas(state.motionIndex, archiveCornerRadius.x * 512);
            state.motionOverlayTexture.needsUpdate = true;
          }
          invalidate();
        }, 120);
        invalidate();
      };
      window.addEventListener(CARD_RADIUS_CHANGE_EVENT, onArchiveRadiusChange);

      function resize() {
        const rect = stage.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, compactQuery.matches ? 1.5 : 2));
        renderer.setSize(rect.width, rect.height, false);
        camera.aspect = rect.width / rect.height;
        /* Portrait screens previously pushed the camera farther away, making
           the library read as a tiny strip. Bring the two rows forward and
           tighten their rhythm so individual faces stay legible by thumb. */
        camera.fov = compactQuery.matches ? 46 : 39;
        camera.position.z = compactQuery.matches ? 8.15 : 9.6;
        camera.updateProjectionMatrix();
        state.visibleHalfWidth = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5))
          * camera.position.z * camera.aspect;
        invalidate();
      }

      function updateCards(dt) {
        const compact = compactQuery.matches;
        const step = spacing();
        const loopLength = step * 11;
        let moving = false;

        if (state.focusTarget === 0) {
          for (let row = 0; row < 2; row += 1) {
            if (state.dragging && state.dragRow === row) continue;
            state.velocities[row] = damp(state.velocities[row], state.autoSpeeds[row], 1.65, dt);
            state.offsets[row] = wrap(state.offsets[row] + state.velocities[row] * dt, loopLength);
          }
          moving = true;
        }

        state.focus = damp(state.focus, state.focusTarget, state.focusTarget ? 6.4 : 8.5, dt);
        state.flip = damp(state.flip, state.flipTarget, 7.6, dt);
        if (Math.abs(state.focus - state.focusTarget) > 0.001 || Math.abs(state.flip - state.flipTarget) > 0.001) moving = true;
        const motionTarget = Number(
          state.active
          && state.motionReady
          && state.motionIndex === state.selectedIndex
          && state.focusTarget === 1
          && state.focus > 0.62
          && state.flipTarget === 0
          && state.flip < 0.16,
        );
        const previousMotionMix = state.motionMix;
        state.motionMix = state.motionImmediate
          ? motionTarget
          : damp(state.motionMix, motionTarget, motionTarget ? 13 : 19, dt);
        if (state.motionMaterial) state.motionMaterial.uniforms.uOpacity.value = state.motionMix;
        if (state.motionOverlayMaterial) state.motionOverlayMaterial.uniforms.uOpacity.value = state.motionMix;
        if (Math.abs(previousMotionMix - state.motionMix) > 0.001) moving = true;
        if (motionTarget && !motionVideo.paused) moving = true;

        const curve = compact ? 0.035 : 0.04;
        const centerDistance = Math.max(compact ? 5.5 : 6.5, state.visibleHalfWidth);
        const exitFadeStart = Math.max(compact ? 3.1 : 4.25, state.visibleHalfWidth - (compact ? 1.45 : 1.75));
        const exitFadeEnd = state.visibleHalfWidth + (compact ? 0.58 : 0.72);
        cards.forEach(card => {
          const baseX = (card.column - 5) * step + state.offsets[card.row];
          const hoverTarget = state.focusTarget === 0 && card.index === state.hoveredIndex && !state.dragging ? 1 : 0;
          card.hover = damp(card.hover, hoverTarget, hoverTarget ? 13 : 10, dt);
          if (Math.abs(card.hover - hoverTarget) > 0.002) moving = true;

          card.instances.forEach(instance => {
            const selected = card.index === state.selectedIndex && instance.copy === state.selectedCopy;
            const x = baseX + instance.copy * loopLength;
            const rowY = card.row === 0 ? (compact ? 1.16 : 1.08) : (compact ? -1.08 : -0.96);
            const y = rowY - curve * x * x;
            const edge = clamp(Math.abs(x) / centerDistance, 0, 1);
            const exitFade = THREE.MathUtils.smoothstep(Math.abs(x), exitFadeStart, exitFadeEnd);
            const rowScale = card.row === 0 ? 0.90 : 1;
            const baseScale = rowScale * (1 - edge * 0.11);
            const baseZ = (card.row === 0 ? -0.58 : 0) - edge * 0.55;
            const baseRotationZ = Math.atan(-2 * curve * x) * 0.82;
            const baseRotationY = -x * (compact ? 0.038 : 0.044);

            let targetX = x;
            let targetY = y + card.hover * 0.08;
            let targetZ = baseZ + card.hover * 0.38;
            let targetScale = baseScale * (1 + card.hover * 0.055);
            let targetRotationX = card.hover * (0.5 - card.pointer.y) * 0.12;
            let targetRotationY = baseRotationY + card.hover * (card.pointer.x - 0.5) * 0.16;
            let targetRotationZ = baseRotationZ;
            let opacity = (1 - edge * 0.10) * (1 - exitFade);
            let dim = 1 - edge * 0.16 - exitFade * 0.16;
            let softness = exitFade;

            if (state.selectedIndex !== null) {
              if (selected) {
                targetX = lerp(targetX, 0, state.focus);
                targetY = lerp(targetY, -0.04, state.focus);
                targetZ = lerp(targetZ, 2.45, state.focus);
                targetScale = lerp(targetScale, compact ? 1.34 : 1.62, state.focus);
                targetRotationX = lerp(targetRotationX, 0, state.focus);
                targetRotationY = lerp(targetRotationY, Math.PI * state.flip, state.focus);
                targetRotationZ = lerp(targetRotationZ, 0, state.focus);
                opacity = 1;
                dim = 1;
                softness = 0;
              } else {
                targetX += Math.sign(x || 1) * state.focus * 0.32;
                targetZ -= state.focus * 0.9;
                opacity *= 1 - state.focus * 0.78;
                dim *= 1 - state.focus * 0.55;
              }
            }

            instance.group.visible = opacity > 0.002 || selected;
            instance.group.position.set(targetX, targetY, targetZ);
            instance.group.rotation.set(targetRotationX, targetRotationY, targetRotationZ);
            instance.group.scale.setScalar(targetScale);
            [instance.frontMaterial, instance.backMaterial].forEach(material => {
              material.uniforms.uHover.value = card.hover;
              material.uniforms.uPointer.value.copy(card.pointer);
              material.uniforms.uOpacity.value = opacity;
              material.uniforms.uDim.value = dim;
              material.uniforms.uSoftness.value = softness;
              material.depthWrite = opacity > 0.72;
            });
            instance.backMaterial.uniforms.uIntensity.value = 0.12
              + Math.max(card.hover, selected ? state.focus : 0) * 0.64;
          });
        });

        if (state.focusTarget === 0 && state.focus < 0.002 && state.selectedIndex !== null) {
          stopFocusedMotion();
          state.selectedIndex = null;
          state.selectedCopy = null;
          state.flip = 0;
        }
        return moving;
      }

      function render(time) {
        state.frame = 0;
        if (!state.active || state.destroyed) return;
        const dt = Math.min(0.034, Math.max(0.001, (time - state.lastFrameTime) / 1000));
        state.lastFrameTime = time;
        const moving = updateCards(dt);
        renderer.render(scene, camera);
        if (moving || state.dragging) invalidate();
      }

      function invalidate() {
        if (!state.active || state.destroyed || state.frame) return;
        state.frame = requestAnimationFrame(render);
      }

      function onPointerDown(event) {
        if (event.button !== 0) return;
        updatePointerFromEvent(event);
        state.dragging = state.focusTarget === 0;
        state.moved = false;
        state.pointerId = event.pointerId;
        state.pointerStartX = event.clientX;
        state.lastX = event.clientX;
        state.lastTime = event.timeStamp;
        if (state.dragging) {
          const intersection = intersectCards();
          state.dragRow = rowFromPointer(event, intersection);
          canvas.setPointerCapture(event.pointerId);
          canvas.setAttribute("data-dragging", "");
          canvas.dataset.dragRow = String(state.dragRow);
          canvas.style.cursor = "grabbing";
          state.velocities[state.dragRow] = 0;
          state.dragSoundTravel = 0;
          state.dragSoundTick = 0;
          uiSfx.activate("drag-start", { volume: 0.16 });
          status.textContent = `Dragging ${state.dragRow === 0 ? "upper" : "lower"} row.`;
        }
        invalidate();
      }

      function onPointerMove(event) {
        updatePointerFromEvent(event);
        if (state.dragging && event.pointerId === state.pointerId) {
          const dx = event.clientX - state.lastX;
          const dt = Math.max(8, event.timeStamp - state.lastTime) / 1000;
          const worldPerPixel = compactQuery.matches ? 0.0116 : 0.0084;
          const loopLength = spacing() * 11;
          const row = state.dragRow ?? 0;
          state.offsets[row] = wrap(state.offsets[row] + dx * worldPerPixel, loopLength);
          state.velocities[row] = clamp((dx * worldPerPixel) / dt, -10, 10);
          state.moved ||= Math.abs(event.clientX - state.pointerStartX) > 5;
          if (state.moved) {
            state.dragSoundTravel += Math.abs(dx * worldPerPixel);
            const detent = spacing() * 0.25;
            if (state.dragSoundTravel >= detent) {
              state.dragSoundTravel %= detent;
              state.dragSoundTick += 1;
              uiSfx.play("snap", {
                volume: 0.18,
                cooldownMs: 38,
                retrigger: "overlap",
                playbackRate: 0.96 + (state.dragSoundTick % 3) * 0.035
              });
            }
          }
          state.lastX = event.clientX;
          state.lastTime = event.timeStamp;
          state.hoveredIndex = null;
        } else {
          setHovered(intersectCards());
        }
        invalidate();
      }

      function onPointerUp(event) {
        updatePointerFromEvent(event);
        const wasDragging = state.dragging;
        const wasMoved = state.moved;
        state.dragging = false;
        state.dragRow = null;
        canvas.removeAttribute("data-dragging");
        delete canvas.dataset.dragRow;
        if (wasDragging && canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        setHovered(intersectCards());
        if (wasMoved) {
          uiSfx.play("drop", { volume: 0.18 });
          status.textContent = "Row released.";
        }
        if (!wasMoved) {
          const intersection = intersectCards();
          const clickedIndex = intersection?.object?.userData?.cardIndex;
          const clickedCopy = intersection?.object?.userData?.copy;
          if (state.selectedIndex !== null) {
            if (clickedIndex === state.selectedIndex) toggleFocusedCard();
            else exitFocus();
          } else if (Number.isInteger(clickedIndex)) {
            focusCard(clickedIndex, false, clickedCopy);
          }
        }
        invalidate();
      }

      function onPointerLeave() {
        if (!state.dragging) {
          state.hoveredIndex = null;
          canvas.style.cursor = "grab";
          invalidate();
        }
      }

      function onWheel(event) {
        if (state.focusTarget !== 0) return;
        event.preventDefault();
        updatePointerFromEvent(event);
        const row = rowFromPointer(event, intersectCards());
        const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
        const impulse = clamp(-delta * 0.018, -2.8, 2.8);
        state.velocities[row] = clamp(state.velocities[row] + impulse, -8, 8);
        invalidate();
      }

      function onKeyDown(event) {
        if (event.key === "Escape" && state.selectedIndex !== null) {
          event.stopPropagation();
          exitFocus(true);
          renderer.render(scene, camera);
          return;
        }
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (state.selectedIndex !== null) toggleFocusedCard(true);
          else focusCard(state.keyboardIndex, true);
          renderer.render(scene, camera);
          return;
        }
        if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
        event.preventDefault();
        if (state.selectedIndex !== null) exitFocus(true);
        if (event.key === "ArrowLeft") state.keyboardIndex = clamp(state.keyboardIndex - 1, 0, 21);
        if (event.key === "ArrowRight") state.keyboardIndex = clamp(state.keyboardIndex + 1, 0, 21);
        if (event.key === "ArrowUp" && state.keyboardIndex >= 11) state.keyboardIndex -= 11;
        if (event.key === "ArrowDown" && state.keyboardIndex < 11) state.keyboardIndex += 11;
        const keyboardRow = state.keyboardIndex < 11 ? 0 : 1;
        const keyboardColumn = state.keyboardIndex % 11;
        state.offsets[keyboardRow] = -(keyboardColumn - 5) * spacing();
        state.velocities[keyboardRow] = 0;
        describeCard(state.keyboardIndex, "Centered");
        updateCards(1);
        renderer.render(scene, camera);
      }

      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("pointermove", onPointerMove);
      canvas.addEventListener("pointerup", onPointerUp);
      canvas.addEventListener("pointercancel", onPointerUp);
      canvas.addEventListener("pointerleave", onPointerLeave);
      canvas.addEventListener("wheel", onWheel, { passive: false });
      canvas.addEventListener("keydown", onKeyDown);
      const stageResizeObserver = new ResizeObserver(resize);
      stageResizeObserver.observe(stage);

      archiveFallback.setAttribute("aria-hidden", "true");
      archiveFallback.querySelectorAll("button").forEach(button => button.tabIndex = -1);
      app.dataset.archiveWebgl = "ready";
      resize();

      return {
        setActive(active) {
          state.active = active;
          if (active) {
            resize();
            state.lastFrameTime = performance.now();
            if (state.motionReady && state.selectedIndex !== null && state.flipTarget === 0) motionVideo.play().catch(() => {});
            invalidate();
          } else {
            motionVideo.pause();
            if (state.frame) {
              cancelAnimationFrame(state.frame);
              state.frame = 0;
            }
          }
        },
        resize,
        focusCard,
        updateCardArtwork,
        destroy() {
          state.destroyed = true;
          stopFocusedMotion();
          if (state.frame) cancelAnimationFrame(state.frame);
          canvas.removeEventListener("pointerdown", onPointerDown);
          canvas.removeEventListener("pointermove", onPointerMove);
          canvas.removeEventListener("pointerup", onPointerUp);
          canvas.removeEventListener("pointercancel", onPointerUp);
          canvas.removeEventListener("pointerleave", onPointerLeave);
          canvas.removeEventListener("wheel", onWheel);
          canvas.removeEventListener("keydown", onKeyDown);
          window.removeEventListener(CARD_RADIUS_CHANGE_EVENT, onArchiveRadiusChange);
          window.clearTimeout(radiusRedrawTimer);
          stageResizeObserver.disconnect();
          cards.forEach(card => {
            card.frontTexture.dispose();
            card.instances.forEach(instance => {
              instance.frontMaterial.dispose();
              instance.backMaterial.dispose();
            });
          });
          backTexture.dispose();
          geometry.dispose();
          renderer.dispose();
        }
      };
    }

    // Fires exactly once, when the ambient background is as ready as it will
    // get — first video frame presented, playback refused, or no video at
    // all. App.jsx holds the boot veil until this signal (with a timeout).
    const announceBackgroundReady = (() => {
      let announced = false;
      return () => {
        if (announced) return;
        announced = true;
        window.__ARCANA_BACKGROUND_READY = true;
        window.dispatchEvent(new Event("arcana:background-ready"));
      };
    })();

    function setupBackgroundVideo(app) {
      const videos = [...app.querySelectorAll(".background-video")];
      const library = Array.isArray(window.TAROT_VIDEO_LIBRARY) ? window.TAROT_VIDEO_LIBRARY.filter(Boolean) : [];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!library.length || videos.length < 2) {
        announceBackgroundReady();
        return () => {};
      }

      const requested = Number.parseInt(new URLSearchParams(window.location.search).get("bg"), 10);
      const index = Number.isInteger(requested) && requested >= 0 && requested < library.length
        ? requested
        : Math.floor(Math.random() * library.length);
      const source = library[index];

      app.dataset.background = String(index + 1);

      /* Reduced motion still gets the first authored frame instead of a blank
         fallback gradient. Do not start a moving background in this branch. */
      if (reduceMotion) {
        const video = videos[0];
        video.autoplay = false;
        const showFrame = () => {
          video.pause();
          video.setAttribute("data-visible", "");
          video.setAttribute("data-front", "");
          announceBackgroundReady();
        };
        video.addEventListener("loadeddata", showFrame, { once: true });
        video.addEventListener("error", showFrame, { once: true });
        video.src = source;
        video.load();
        // Expose the poster immediately; loadeddata replaces it with the
        // authored first frame, while decode failures keep the poster visible.
        video.setAttribute("data-visible", "");
        video.setAttribute("data-front", "");
        if (video.readyState >= 2) showFrame();
        return () => {
          video.removeEventListener("loadeddata", showFrame);
          video.removeEventListener("error", showFrame);
          video.pause();
          video.removeAttribute("data-visible");
          video.removeAttribute("data-front");
        };
      }

      const CROSSFADE_MS = 360;
      const CROSSFADE_LEAD_SECONDS = 0.52;
      let activeVideo = videos[0];
      let crossfading = false;
      let fadeTimer = 0;
      let fadeFrame = 0;
      let disposed = false;

      const resetVideo = video => {
        video.pause();
        video.removeAttribute("data-visible");
        video.removeAttribute("data-front");
        video.removeAttribute("data-fading");
        try { video.currentTime = 0; } catch {}
      };
